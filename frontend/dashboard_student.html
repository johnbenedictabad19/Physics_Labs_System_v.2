<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <script>(function(){var t=localStorage.getItem('physlab_theme')||'light';document.documentElement.setAttribute('data-theme',t);if(sessionStorage.getItem('physlab_nav')){sessionStorage.removeItem('physlab_nav');document.documentElement.setAttribute('data-entering','');}})();</script>

    <meta charset="UTF-8">
    <link rel="icon" href="/static/favicons/dashboard_student.svg" type="image/svg+xml">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="PHYSLAB">
    <link rel="apple-touch-icon" href="/static/logo.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PHYSLAB — Student Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Abril+Fatface&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="static/style.css">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --primary:   #0A66C2;
            --primary-l: #5b9bd5;
            --primary-dark:   #004182;
            --primary-dark-l: #a78bfa;
        }
        [data-theme="dark"] {
            --bg:         #1B1F23;
            --bg-2:       #16191D;
            --surface:    #22272B;
            --border:     rgba(255,255,255,0.08);
            --border-h:   rgba(10,102,194,0.15);
            --text:       #ffffff;
            --text-2:     rgba(255,255,255,0.65);
            --text-3:     rgba(255,255,255,0.35);
            --input-bg:   rgba(255,255,255,0.05);
            --input-bg-f: rgba(255,255,255,0.08);
            --placeholder: rgba(255,255,255,0.25);
            --card-bg:    rgba(255,255,255,0.03);
            --skeleton:   rgba(255,255,255,0.06);
            --skeleton-s: rgba(255,255,255,0.10);
        }
        [data-theme="light"] {
            --bg:         #eeeeff;
            --bg-2:       #e4e4f8;
            --surface:    #ffffff;
            --border:     rgba(10,102,194,0.12);
            --border-h:   rgba(10,102,194,0.45);
            --text:       #1B1F23;
            --text-2:     #555555;
            --text-3:     #888888;
            --input-bg:   #F9F9F9;
            --input-bg-f: #F0F0F0;
            --placeholder: #AAAAAA;
            --card-bg:    rgba(10,102,194,0.02);
            --skeleton:   rgba(10,102,194,0.07);
            --skeleton-s: rgba(10,102,194,0.13);
        }

        html, body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            transition: background 0.4s, color 0.4s;
            min-height: 100vh;
        }

        body::before {
            content: '';
            position: fixed; top: -200px; left: -200px;
            width: 600px; height: 600px;
            background: transparent;
            pointer-events: none; z-index: 0;
        }
        body::after {
            content: '';
            position: fixed; bottom: -200px; right: -200px;
            width: 500px; height: 500px;
            background: transparent;
            pointer-events: none; z-index: 0;
        }
        .bg-grid {
            position: fixed; inset: 0; z-index: 0; pointer-events: none;
            
            background-image: linear-gradient(var(--border) 1px, transparent 1px), linear-gradient(90deg, var(--border) 1px, transparent 1px);
            background-size: 60px 60px;
        }

        .particles { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
        .particle {
            position: absolute; width: 2px; height: 2px; border-radius: 50%;
            background: rgba(129,140,248,0.7);
            animation: floatParticle linear infinite;
        }
        @keyframes floatParticle {
            0%   { transform: translateY(100vh) translateX(0) scale(0); opacity: 0; }
            10%  { opacity: 1; }
            90%  { opacity: 0.5; }
            100% { transform: translateY(-100px) translateX(var(--drift)) scale(1.5); opacity: 0; }
        }

        /* ═══ NAVBAR ═══ */
        .navbar {
            position: fixed;
            top: 14px; left: 50%; right: auto;
            transform: translateX(-50%);
            z-index: 200;
            width: calc(100% - 48px); max-width: 1280px;
            height: 52px; padding: 0 18px;
            display: flex; align-items: center; justify-content: space-between; gap: 12px;
            background: rgba(15,14,26,0.45);
            backdrop-filter: blur(40px) saturate(180%);
            -webkit-backdrop-filter: blur(40px) saturate(180%);
            border-radius: 26px;
            border: 1px solid rgba(255,255,255,0.09);
            box-shadow: 0 8px 32px rgba(0,0,0,0.35), 0 2px 8px rgba(0,0,0,0.2), inset 0 1px 0 rgba(255,255,255,0.07);
            transition: box-shadow 0.3s, background 0.3s;
        }
        [data-theme="light"] .navbar {
            background: rgba(255,255,255,0.75);
            border-color: rgba(10,102,194,0.15);
            box-shadow: 0 8px 32px rgba(10,102,194,0.1), 0 2px 8px rgba(0,0,0,0.06), inset 0 1px 0 rgba(255,255,255,0.9);
        }
        .nav-left { display: flex; align-items: center; gap: 14px; }
        .nav-brand {
            font-family: 'Abril Fatface', sans-serif;
            font-size: 16px; font-weight: 700; letter-spacing: -0.3px;
            color: var(--text); display: flex; align-items: center; gap: 10px;
            text-decoration: none;
        }
        .brand-icon {
            width: 32px; height: 32px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 12px; overflow: hidden;
        }
        .brand-icon img { width: 100%; height: 100%; object-fit: contain; }
        .nav-user { display: flex; align-items: center; gap: 10px; }
        .nav-hello { font-size: 13px; color: var(--text-2); }
        .nav-hello strong { color: var(--text); font-weight: 600; }
        .badge-student {
            padding: 3px 10px; border-radius: 6px; font-size: 11px; font-weight: 700;
            background: rgba(16,185,129,0.12); color: #6ee7b7;
            border: 1px solid rgba(16,185,129,0.1);
        }
        .nav-avatar {
            width: 34px; height: 34px; border-radius: 8px;
            background: #0A66C2;
            display: flex; align-items: center; justify-content: center;
            color: white; font-weight: 800; font-size: 13px;
            text-decoration: none; overflow: hidden;
            transition: transform 0.18s, box-shadow 0.18s;
        }
        .nav-avatar:hover { transform: scale(1.07); box-shadow: 0 4px 12px rgba(10,102,194,0.15); }
        .nav-avatar img { width: 100%; height: 100%; object-fit: cover; display: none; }
        .nav-av-initial { font-size: 13px; font-weight: 800; }
        .btn-logout {
            padding: 7px 14px; border-radius: 8px; font-size: 12px; font-weight: 600;
            background: transparent; border: 1px solid var(--border); color: var(--text-2);
            cursor: pointer; transition: all 0.2s; display: flex; align-items: center; gap: 6px;
            font-family: 'Inter', sans-serif;
        }
        .btn-logout:hover { border-color: rgba(239,68,68,0.4); color: #fca5a5; background: rgba(239,68,68,0.07); }

        /* ── Nav Dropdown ── */
        .nav-avatar-wrap { position: relative; }
        .nav-avatar { cursor: pointer; border: none; padding: 0; background: none; }
        .nav-dropdown {
            display: none; position: absolute; right: 0; top: calc(100% + 10px);
            background: var(--surface); border: 1px solid var(--border);
            border-radius: 10px; min-width: 185px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.25);
            overflow: hidden; z-index: 300;
        }
        .nav-dropdown.open { display: block; }
        .nav-dropdown a, .nav-dropdown button {
            display: flex; align-items: center; gap: 10px;
            width: 100%; padding: 10px 16px; text-align: left;
            font-size: 13px; font-weight: 500; color: var(--text);
            background: none; border: none; text-decoration: none;
            cursor: pointer; transition: background 0.15s;
            font-family: 'Inter', sans-serif; box-sizing: border-box;
        }
        .nav-dropdown a:hover, .nav-dropdown button:hover { background: rgba(255,255,255,0.06); }
        [data-theme="light"] .nav-dropdown a:hover,
        [data-theme="light"] .nav-dropdown button:hover { background: rgba(0,0,0,0.05); }
        .nd-divider { height: 1px; background: var(--border); margin: 4px 0; }
        .nd-logout { color: #fca5a5 !important; }
        .nd-logout:hover { background: rgba(239,68,68,0.08) !important; }
        @media (max-width: 768px) {
            .navbar { padding: 0 14px; width: calc(100% - 24px); }
            .nav-brand { font-size: 16px; }
            .nav-hello { display: none; }
            .badge-prof, .badge-student { display: none; }
            .btn-logout { padding: 6px 10px; font-size: 12px; }
        }
        @media (max-width: 480px) {
            .navbar { padding: 0 12px; width: calc(100% - 16px); }
            .nav-brand { font-size: 14px; }
            #my-activities-card { display: none; }
        }

        /* ═══ LAYOUT ═══ */
        .dashboard-container {
            position: relative; z-index: 1;
            max-width: 1100px; margin: 0 auto;
            padding: 88px 28px 60px;
        }

        /* ═══ WELCOME BANNER ═══ */
        .welcome-banner {
            border-radius: 20px; padding: 36px 40px; margin-bottom: 24px;
            background: #059669;
            position: relative; overflow: hidden;
            display: flex; align-items: center; justify-content: space-between; gap: 20px;
            box-shadow: 0 8px 40px rgba(5,150,105,0.28);
        }
        .welcome-banner::before {
            content: ''; position: absolute; top: -80px; right: -80px;
            width: 280px; height: 280px; border-radius: 50%;
            background: rgba(255,255,255,0.06); pointer-events: none;
        }
        .welcome-banner::after {
            content: ''; position: absolute; bottom: -50px; left: 30%;
            width: 180px; height: 180px; border-radius: 50%;
            background: rgba(255,255,255,0.04); pointer-events: none;
        }
        .wb-left { position: relative; z-index: 1; }
        .db-welcome-greeting { font-size: 12px; color: rgba(255,255,255,0.6); margin-bottom: 4px; letter-spacing: 0.8px; text-transform: uppercase; }
        .db-welcome-name {
            font-family: 'Inter', sans-serif;
            font-size: clamp(20px, 2.8vw, 30px); font-weight: 800;
            color: white; letter-spacing: -1px; margin-bottom: 6px; line-height: 1.1;
        }
        .db-welcome-sub { font-size: 13px; color: rgba(255,255,255,0.55); }

        .db-stat-cards { display: flex; gap: 12px; flex-shrink: 0; position: relative; z-index: 1; }
        .db-stat-card {
            background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.18);
            border-radius: 16px; padding: 16px 20px;
            display: flex; align-items: center; gap: 12px;
            backdrop-filter: blur(12px);
        }
        .db-stat-card-icon {
            width: 36px; height: 36px; border-radius: 9px;
            background: rgba(255,255,255,0.15);
            display: flex; align-items: center; justify-content: center;
            font-size: 17px; color: white; flex-shrink: 0;
        }
        .db-stat-num {
            font-family: 'Inter', sans-serif;
            font-size: 22px; font-weight: 800; color: white; line-height: 1; display: block;
        }
        .db-stat-label { font-size: 10px; color: rgba(255,255,255,0.6); margin-top: 3px; display: block; }

        /* ═══ SECTION HEADER ═══ */
        .db-section-header {
            display: flex; align-items: center; justify-content: space-between; margin-bottom: 22px;
        }
        .btn-join-class {
            -moz-appearance: none; -webkit-appearance: none; appearance: none;
            border: none; background: none; color: #fff;
            cursor: pointer; position: relative;
            padding: 8px; font-weight: 700; font-size: 12px;
            font-family: 'Inter', sans-serif;
            letter-spacing: 0.4px; text-transform: uppercase;
            transition: all .15s ease;
        }
        .btn-join-class::before, .btn-join-class::after {
            content: ''; display: block; position: absolute;
            right: 0; left: 0; height: calc(50% - 5px);
            border: 1px solid rgba(5,150,105,0.5); transition: all .15s ease;
        }
        .btn-join-class::before { top: 0; border-bottom-width: 0; }
        .btn-join-class::after  { bottom: 0; border-top-width: 0; }
        .btn-join-class:focus { outline: none; }
        .btn-join-class:active::before, .btn-join-class:active::after { right: 3px; left: 3px; }
        .btn-join-class:active::before { top: 3px; }
        .btn-join-class:active::after  { bottom: 3px; }
        .btn-join-class .button_lg { background-color: #059669; }
        .btn-join-class .button_lg::before, .btn-join-class .button_lg::after { background-color: #059669; }
        .btn-join-class .button_sl { background-color: #047857; }
        .btn-join-class:hover .button_sl { width: calc(100% + 15px); }
        .btn-join-class:hover .button_lg::after { background-color: #fff; }

        /* ═══ JOIN MODAL ═══ */
        .modal-overlay {
            position: fixed; inset: 0; z-index: 200;
            background: rgba(0,0,0,0.6); backdrop-filter: blur(6px);
            display: none; align-items: center; justify-content: center; padding: 20px;
        }
        .modal-overlay.open { display: flex; }
        .modal-box {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: 20px; padding: 30px; width: 100%; max-width: 400px;
            animation: modalIn 0.25s ease;
        }
        @keyframes modalIn { from { opacity:0; transform:scale(0.95) translateY(10px); } to { opacity:1; transform:scale(1) translateY(0); } }
        .modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 22px; }
        .modal-title {
            font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 700;
            color: var(--text) !important; display: flex; align-items: center; gap: 9px;
        }
        .modal-title i { color: var(--primary-l); }
        .modal-close {
            width: 32px; height: 32px; border-radius: 8px;
            background: var(--card-bg); border: 1px solid var(--border);
            color: var(--text-2); cursor: pointer; font-size: 14px;
            display: flex; align-items: center; justify-content: center; transition: all 0.2s;
        }
        .modal-close:hover { background: rgba(239,68,68,0.1); border-color: rgba(239,68,68,0.3); color: #fca5a5; }
        .form-field label { display: block; font-size: 12px; font-weight: 600; color: var(--text-2); margin-bottom: 7px; }
        .form-field input {
            width: 100%; padding: 11px 14px;
            background: var(--input-bg); border: 1.5px solid var(--border);
            border-radius: 10px; font-size: 14px; color: var(--text); letter-spacing: 2px;
            outline: none; transition: all 0.25s; font-family: 'Inter', sans-serif;
            text-transform: uppercase; font-weight: 600;
        }
        .form-field input:focus { border-color: var(--primary); background: var(--input-bg-f); box-shadow: 0 0 0 3px rgba(10,102,194,0.12); }
        .form-field input::placeholder { color: var(--placeholder); text-transform: none; letter-spacing: 0; font-weight: 400; }
        .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 22px; }
        .btn-cancel {
            overflow:hidden; height:40px; min-width:100px; padding:0 20px;
            display:inline-flex; align-items:center; justify-content:center;
            background:transparent; border:1px solid rgba(91,155,213,0.3); border-radius:3px;
            font-size:12px; letter-spacing:1px; font-weight:600;
            text-transform:uppercase; font-family:'Inter',sans-serif;
            color:var(--text-2); cursor:pointer; position:relative; transition:all 0.3s ease;
        }
        .btn-cancel::before, .btn-cancel::after { content:""; position:absolute; width:0; height:2px; background-color:var(--primary); transition:all 0.5s cubic-bezier(0.35,0.1,0.25,1); }
        .btn-cancel::before { right:0; top:0; }
        .btn-cancel::after  { left:0; bottom:0; transition:all 0.3s cubic-bezier(0.35,0.1,0.25,1); }
        .btn-cancel > span.bc-span { width:100%; height:100%; position:absolute; left:0; top:0; z-index:1; }
        .btn-cancel > span.bc-span::before, .btn-cancel > span.bc-span::after { content:""; position:absolute; width:2px; height:0; background-color:var(--primary); transition:all 0.3s cubic-bezier(0.35,0.1,0.25,1); }
        .btn-cancel > span.bc-span::before { right:0; top:0; transition:all 0.5s cubic-bezier(0.35,0.1,0.25,1); }
        .btn-cancel > span.bc-span::after  { left:0; bottom:0; }
        .btn-cancel-inner { position:absolute; inset:0; z-index:2; }
        .btn-cancel-default, .btn-cancel-hover { position:absolute; width:100%; display:flex; align-items:center; justify-content:center; gap:7px; transition:all 0.4s cubic-bezier(0.35,0.1,0.25,1); }
        .btn-cancel-default { top:50%; transform:translateY(-50%); color:var(--text-2); }
        .btn-cancel-hover   { top:150%; color:var(--primary-l); }
        .btn-cancel:hover::before, .btn-cancel:hover::after { width:100%; }
        .btn-cancel:hover > span.bc-span::before, .btn-cancel:hover > span.bc-span::after { height:100%; }
        .btn-cancel:hover .btn-cancel-default { top:-50%; transform:translateY(0) rotate(5deg); }
        .btn-cancel:hover .btn-cancel-hover   { top:50%; transform:translateY(-50%); }
        .btn-confirm-join {
            -moz-appearance: none; -webkit-appearance: none; appearance: none;
            border: none; background: none; color: #fff;
            cursor: pointer; position: relative;
            padding: 8px; font-weight: 700; font-size: 13px;
            font-family: 'Inter', sans-serif;
            letter-spacing: 0.4px; text-transform: uppercase;
            transition: all .15s ease;
        }
        .btn-confirm-join::before, .btn-confirm-join::after {
            content: ''; display: block; position: absolute;
            right: 0; left: 0; height: calc(50% - 5px);
            border: 1px solid rgba(5,150,105,0.5); transition: all .15s ease;
        }
        .btn-confirm-join::before { top: 0; border-bottom-width: 0; }
        .btn-confirm-join::after  { bottom: 0; border-top-width: 0; }
        .btn-confirm-join:focus { outline: none; }
        .btn-confirm-join:active::before, .btn-confirm-join:active::after { right: 3px; left: 3px; }
        .btn-confirm-join:active::before { top: 3px; }
        .btn-confirm-join:active::after  { bottom: 3px; }
        .btn-confirm-join:disabled { opacity: 0.55; cursor: not-allowed; pointer-events: none; }
        .btn-confirm-join .button_lg { background-color: #059669; }
        .btn-confirm-join .button_lg::before, .btn-confirm-join .button_lg::after { background-color: #059669; }
        .btn-confirm-join .button_sl { background-color: #047857; }
        .btn-confirm-join:hover:not(:disabled) .button_sl { width: calc(100% + 15px); }
        .btn-confirm-join:hover:not(:disabled) .button_lg::after { background-color: #fff; }

        /* ═══ SECTION CARD ═══ */
        .section-card {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: 20px; padding: 28px 30px; margin-bottom: 20px;
            transition: background 0.4s, border-color 0.4s;
        }
        .db-section-title {
            font-family: 'Inter', sans-serif;
            font-size: 13px; font-weight: 700; letter-spacing: -0.3px;
            color: var(--text); margin-bottom: 20px;
            display: flex; align-items: center; gap: 9px;
        }
        .db-section-title i { color: var(--primary-l); font-size: 17px; }

        /* ═══ GOOGLE CLASSROOM STYLE CARDS ═══ */
        .db-classes-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px;
        }
        .db-class-card {
            border-radius: 16px; overflow: visible;
            border: 1px solid var(--border);
            cursor: pointer; transition: all 0.25s;
            animation: cardIn 0.4s both;
            background: var(--surface);
        }
        @keyframes cardIn { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:translateY(0); } }
        .db-class-card:hover { transform: translateY(-4px); box-shadow: 0 16px 48px rgba(0,0,0,0.25); }

        .cc-banner {
            height: 90px; position: relative; overflow: hidden; border-radius: 14px 14px 0 0;
            display: flex; align-items: flex-end; padding: 10px 14px;
            border-radius: 14px 14px 0 0;
        }
        .tb-0 { background: repeating-linear-gradient(45deg, rgba(167,139,250,0.15) 0, rgba(167,139,250,0.15) 1.5px, transparent 1.5px, transparent 14px), linear-gradient(135deg, #6d28d9, #4c1d95); }
        .tb-1 {
            background:
                repeating-linear-gradient(45deg,rgba(251,146,60,0.13) 0,rgba(251,146,60,0.13) 2px,transparent 2px,transparent 16px),
                linear-gradient(135deg,#1e3a5f,#0a1628);
        }
        .tb-2 {
            background:
                repeating-linear-gradient(0deg,rgba(251,191,36,0.1) 0,rgba(251,191,36,0.1) 1.5px,transparent 1.5px,transparent 14px),
                linear-gradient(135deg,#7c2d12,#1c0a00);
        }
        .tb-3 {
            background:
                repeating-linear-gradient(60deg,rgba(129,140,248,0.13) 0,rgba(129,140,248,0.13) 1px,transparent 1px,transparent 10px),
                repeating-linear-gradient(-60deg,rgba(129,140,248,0.13) 0,rgba(129,140,248,0.13) 1px,transparent 1px,transparent 10px),
                linear-gradient(135deg,#0c1445,#050a1e);
        }
        .tb-4 {
            background:
                radial-gradient(circle,rgba(34,211,238,0.15) 1px,transparent 1px),
                linear-gradient(135deg,#0A66C2,#004182);
            background-size: 14px 14px, 100% 100%;
        }
        .tb-5 {
            background:
                radial-gradient(rgba(132,204,22,0.18) 1px,transparent 1px),
                linear-gradient(135deg,#052e16,#010b05);
            background-size: 14px 14px, 100% 100%;
        }
        .tb-6 { background: linear-gradient(135deg,#1a1625,#0d1117); }
        .cc-banner-icon {
            width: 40px; height: 40px; border-radius: 10px;
            background: rgba(255,255,255,0.15); backdrop-filter: blur(8px);
            display: flex; align-items: center; justify-content: center;
            font-size: 20px; color: white;
        }
        .cc-banner-code {
            position: absolute; top: 10px; right: 12px;
            font-family: 'Inter', sans-serif; font-size: 10px; font-weight: 700;
            color: rgba(255,255,255,0.8); letter-spacing: 1.2px;
            background: rgba(0,0,0,0.2); border-radius: 5px; padding: 2px 8px;
        }
        .cc-card-body { padding: 14px 16px 16px; }
        .cc-class-name {
            font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 700;
            letter-spacing: -0.3px; color: var(--text); margin-bottom: 3px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .cc-class-sub { font-size: 12px; color: var(--text-2); margin-bottom: 2px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .cc-class-section { font-size: 11px; color: var(--text-3); margin-bottom: 14px; }
        .cc-card-footer {
            display: flex; justify-content: space-between; align-items: center;
            padding-top: 12px; border-top: 1px solid var(--border);
        }
        .cc-prof { font-size: 12px; color: var(--text-2); display: flex; align-items: center; gap: 5px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 80%; }
        .cc-prof i { color: var(--primary-l); flex-shrink: 0; }
        .cc-arrow { color: var(--text-3); font-size: 16px; transition: all 0.2s; flex-shrink: 0; }
        .db-class-card:hover .cc-arrow { color: var(--primary-l); transform: translateX(3px); }

        /* ── Card 3-dot Menu ── */
        .cc-menu-wrap { position: absolute; top: 8px; right: 8px; z-index: 10; }
        .cc-menu-btn {
            width: 28px; height: 28px; border-radius: 7px;
            background: rgba(0,0,0,0.35); border: 1px solid rgba(255,255,255,0.15);
            color: white; font-size: 15px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: background 0.2s; backdrop-filter: blur(4px);
        }
        .cc-menu-btn:hover { background: rgba(0,0,0,0.55); }
        .card-dropdown {
            position: fixed; z-index: 500;
            background: var(--surface); border: 1px solid var(--border);
            border-radius: 10px; min-width: 170px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
            display: none; flex-direction: column; overflow: hidden;
        }
        .card-dropdown.open { display: flex; }
        .card-dropdown a, .card-dropdown button {
            display: flex; align-items: center; gap: 10px;
            padding: 9px 14px; text-align: left; width: 100%;
            font-size: 13px; font-weight: 500; color: var(--text);
            background: none; border: none; text-decoration: none;
            cursor: pointer; transition: background 0.15s;
            font-family: 'Inter', sans-serif; box-sizing: border-box;
        }
        .card-dropdown a:hover, .card-dropdown button:hover { background: rgba(255,255,255,0.06); }
        [data-theme="light"] .card-dropdown a:hover,
        [data-theme="light"] .card-dropdown button:hover { background: rgba(0,0,0,0.05); }
        .card-dropdown a i, .card-dropdown button i { font-size: 15px; color: var(--text-2); }
        .cd-divider { height: 1px; background: var(--border); margin: 4px 0; }
        .cd-danger { color: #fca5a5 !important; }
        .cd-danger i { color: #fca5a5 !important; }
        .cd-danger:hover { background: rgba(239,68,68,0.08) !important; }
        /* Confirm modal */
        .cm-overlay {
            position: fixed; inset: 0; z-index: 400;
            background: rgba(0,0,0,0.55); backdrop-filter: blur(6px);
            display: none; align-items: center; justify-content: center;
        }
        .cm-overlay.open { display: flex; }
        .cm-box {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: 18px; padding: 28px 26px; max-width: 340px; width: 90%;
            text-align: center; box-shadow: 0 16px 48px rgba(0,0,0,0.3);
            animation: cmIn 0.25s ease;
        }
        @keyframes cmIn { from { transform: translateY(10px) scale(0.97); opacity:0; } to { transform:none; opacity:1; } }
        .cm-icon { font-size: 36px; margin-bottom: 12px; }
        .cm-title { font-size: 15px; font-weight: 700; color: var(--text); margin-bottom: 8px; }
        .cm-msg { font-size: 13px; color: var(--text-2); line-height: 1.6; margin-bottom: 20px; }
        .cm-btns { display: flex; gap: 8px; justify-content: center; }
        .cm-btn-cancel {
            padding: 9px 20px; border-radius: 9px; border: 1px solid var(--border);
            background: none; color: var(--text-2); font-size: 13px; font-weight: 600;
            cursor: pointer; font-family: 'Inter', sans-serif; transition: all 0.2s;
        }
        .cm-btn-cancel:hover { border-color: var(--border-h); color: var(--text); }
        .cm-btn-confirm {
            padding: 9px 20px; border-radius: 9px; border: none;
            background: #ef4444; color: white; font-size: 13px; font-weight: 600;
            cursor: pointer; font-family: 'Inter', sans-serif; transition: background 0.2s;
        }
        .cm-btn-confirm:hover { background: #dc2626; }

        /* ═══ ACTIVITY LIST ═══ */
        .activity-item {
            display: flex; align-items: center; gap: 14px;
            padding: 13px 10px; border-bottom: 1px solid var(--border);
            cursor: pointer; border-radius: 10px; transition: all 0.2s;
        }
        .activity-item:last-child { border-bottom: none; }
        .activity-item:hover { background: var(--card-bg); }
        .activity-icon {
            width: 38px; height: 38px; border-radius: 10px;
            background: rgba(10,102,194,0.12);
            display: flex; align-items: center; justify-content: center;
            font-size: 18px; color: var(--primary-l); flex-shrink: 0;
        }
        .activity-info { flex: 1; min-width: 0; }
        .activity-info strong { font-size: 13px; font-weight: 600; color: var(--text); display: block; }
        .activity-info p { font-size: 12px; color: var(--text-3); margin-top: 2px; }
        .activity-right { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex-shrink: 0; }

        .status-badge {
            padding: 3px 10px; border-radius: 6px; font-size: 11px; font-weight: 700;
            display: inline-flex; align-items: center; gap: 4px;
        }
        .status-graded        { background: rgba(16,185,129,0.12); color: #6ee7b7; border: 1px solid rgba(16,185,129,0.1); }
        .status-submitted     { background: rgba(59,130,246,0.12);  color: #93c5fd; border: 1px solid rgba(59,130,246,0.25); }
        .status-late          { background: rgba(245,158,11,0.12);  color: #fcd34d; border: 1px solid rgba(245,158,11,0.25); }
        .status-overdue       { background: rgba(239,68,68,0.12);   color: #fca5a5; border: 1px solid rgba(239,68,68,0.25); }
        .status-not-submitted { background: var(--card-bg); color: var(--text-3); border: 1px solid var(--border); }

        .grade-pill { font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 800; color: var(--primary-l); }
        .due-info { font-size: 11px; color: var(--text-3); display: flex; align-items: center; gap: 4px; margin-top: 3px; }
        .due-info.overdue { color: #fca5a5; }

        /* ═══ SKELETON ═══ */
        .db-class-card-skeleton {
            background: var(--card-bg); border: 1px solid var(--border);
            border-radius: 16px; overflow: hidden;
        }
        .skeleton-banner  { height: 90px; background: var(--skeleton); animation: shimmer 1.5s ease-in-out infinite alternate; }
        .skeleton-body    { padding: 14px 16px 16px; }
        .skeleton-icon    { width:42px; height:42px; border-radius:12px; background:var(--skeleton); animation:shimmer 1.5s ease-in-out infinite alternate; flex-shrink:0; }
        .skeleton-badge   { width:60px; height:18px; border-radius:6px;  background:var(--skeleton); animation:shimmer 1.5s ease-in-out infinite alternate; }
        .skeleton-line    { height:10px; border-radius:5px; background:var(--skeleton); animation:shimmer 1.5s ease-in-out infinite alternate; margin-bottom:8px; }
        .skeleton-title   { width:70%; height:14px; }
        .skeleton-sub     { width:55%; }
        .skeleton-sub.short { width:35%; }
        .skeleton-content { flex:1; }
        .skeleton-item    { display:flex; align-items:center; gap:14px; padding:14px 0; border-bottom:1px solid var(--border); }
        .skeleton-item:last-child { border-bottom:none; }
        @keyframes shimmer { from{background:var(--skeleton)} to{background:var(--skeleton-s)} }

        /* ═══ EMPTY STATE ═══ */
        .db-empty-state { text-align: center; padding: 48px 20px; }
        .db-empty-title { font-family:'Inter',sans-serif; font-size:15px; font-weight:700; color:var(--text-2); margin-bottom:6px; }
        .db-empty-sub   { font-size:13px; color:var(--text-3); }


        .button_lg {
            position: relative; display: flex;
            align-items: center; justify-content: center; gap: 8px;
            padding: 10px 18px; color: #fff; overflow: hidden;
        }
        .button_lg::before {
            content: ''; display: block; position: absolute;
            top: 0; left: 0; width: 2px; height: 2px;
            background-color: inherit;
        }
        .button_lg::after {
            content: ''; display: block; position: absolute;
            right: 0; bottom: 0; width: 4px; height: 4px;
            background-color: inherit; transition: all .2s ease;
        }
        .button_sl {
            display: block; position: absolute;
            top: 0; bottom: -1px; left: -8px;
            width: 0; transform: skew(-15deg); transition: all .2s ease;
        }
        .button_text {
            position: relative; display: flex; align-items: center; gap: 8px;
        }
    </style>
</head>

<script>
// ═══ PARTICLES ═══
const pw = document.getElementById('particles');
for (let i = 0; i < 200; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    p.style.cssText = `left:${Math.random()*100}%;animation-delay:-${Math.random()*8}s;animation-duration:${6+Math.random()*8}s;--drift:${(Math.random()-.5)*200}px`;
    pw.appendChild(p);
}

// ═══ THEME ═══
function applyTheme(t) {
    document.documentElement.setAttribute('data-theme', t);
    localStorage.setItem('physlab_theme', t);
}
applyTheme(localStorage.getItem('physlab_theme') || 'dark');

// ═══ AUTH + NAME ═══
checkAuth('student');
const token = localStorage.getItem('token');
document.addEventListener('DOMContentLoaded', () => {
    const name = localStorage.getItem('first_name') || localStorage.getItem('full_name') || 'Student';
    document.getElementById('welcomeName').textContent = name;
});



// ═══ CARD MENU ═══
const _classMap = {};
let _cmCallback = null;
function openCardMenu(e, id) {
    e.stopPropagation();
    const dd = document.getElementById('cardDropdown');
    if (dd.classList.contains('open') && dd.dataset.forId == id) {
        dd.classList.remove('open'); return;
    }
    const c = _classMap[id] || {};
    dd.dataset.forId = id;
    dd.innerHTML = `
        <a onclick="navigateTo('/class_detail?id=${id}');closeCardMenu()"><i class="ph-bold ph-arrow-square-out"></i> View Class</a>
        <a onclick="copyClassCode(${id});closeCardMenu()"><i class="ph-bold ph-copy"></i> Copy Class Code</a>
        <div class="cd-divider"></div>
        <button class="cd-danger" onclick="confirmUnenroll(${id});closeCardMenu()"><i class="ph-bold ph-sign-out"></i> Unenroll</button>`;
    positionCardMenu(e.currentTarget);
    dd.classList.add('open');
}
function positionCardMenu(btn) {
    const dd = document.getElementById('cardDropdown');
    const r = btn.getBoundingClientRect();
    dd.style.top  = (r.bottom + window.scrollY + 4) + 'px';
    dd.style.left = Math.max(8, r.right - 170 + window.scrollX) + 'px';
}
function closeCardMenu() { document.getElementById('cardDropdown')?.classList.remove('open'); }
document.addEventListener('click', e => { if (!e.target.closest('.cc-menu-btn') && !e.target.closest('.card-dropdown')) closeCardMenu(); });

function copyClassCode(id) {
    const code = (_classMap[id] || {}).code || '';
    navigator.clipboard.writeText(code).then(() => showToast('Class code copied!', 'success'));
}
async function doArchiveMember(id) {
    try {
        const r = await fetch(`/api/classes/${id}/archive-member`, {
            method: 'POST', headers: { 'Authorization': `Bearer ${token}` }
        });
        const d = await r.json();
        if (r.ok) { showToast(d.message, 'success'); loadClasses(); }
        else showToast(d.message || 'Failed!', 'error');
    } catch { showToast('Cannot connect to server!', 'error'); }
}
function confirmUnenroll(id) {
    const name = (_classMap[id] || {}).name || 'this class';
    document.getElementById('cmIcon').textContent  = '🚪';
    document.getElementById('cmTitle').textContent = 'Unenroll from Class?';
    document.getElementById('cmMsg').textContent   = `You will be removed from "${name}". You can rejoin with the class code.`;
    document.getElementById('cmConfirmBtn').textContent = 'Unenroll';
    _cmCallback = () => doUnenroll(id);
    document.getElementById('cmConfirmBtn').onclick = () => { _cmCallback && _cmCallback(); };
    document.getElementById('cmOverlay').classList.add('open');
}
function closeCM() { document.getElementById('cmOverlay').classList.remove('open'); }
async function doUnenroll(id) {
    closeCM();
    try {
        const r = await fetch(`/api/classes/${id}/unenroll`, {
            method: 'DELETE', headers: { 'Authorization': `Bearer ${token}` }
        });
        const d = await r.json();
        if (r.ok) { showToast(d.message, 'success'); loadClasses(); }
        else showToast(d.message || 'Failed to unenroll!', 'error');
    } catch { showToast('Cannot connect to server!', 'error'); }
}

// ═══ THEMES ═══
const THEMES = [
    { id:0, name:'Default',                icon:'ph-atom',          bannerClass:'tb-0', physicist:'static/physicists/einstein.jpg',
      decos:[{icon:'ph-atom',size:52,top:-10,right:58,opacity:0.11,rotate:0},{icon:'ph-planet',size:20,top:10,right:118,opacity:0.08,rotate:20},{icon:'ph-spiral',size:15,top:62,right:106,opacity:0.07,rotate:0}] },
    { id:1, name:'Basic Mechanics',        icon:'ph-gear-six',      bannerClass:'tb-1', physicist:'static/physicists/newton.jpg',
      decos:[{icon:'ph-gear-six',size:54,top:-14,right:56,opacity:0.11,rotate:15},{icon:'ph-ruler',size:20,top:8,right:118,opacity:0.08,rotate:-35},{icon:'ph-arrows-out',size:15,top:62,right:108,opacity:0.07,rotate:0}] },
    { id:2, name:'Waves & Thermo',         icon:'ph-wave-sine',     bannerClass:'tb-2', physicist:'static/physicists/planck.jpg',
      decos:[{icon:'ph-wave-sine',size:50,top:-6,right:56,opacity:0.11,rotate:0},{icon:'ph-thermometer',size:20,top:10,right:118,opacity:0.08,rotate:5},{icon:'ph-fire',size:15,top:62,right:106,opacity:0.07,rotate:0}] },
    { id:3, name:'Electricity & Magnetism',icon:'ph-lightning',     bannerClass:'tb-3', physicist:'static/physicists/maxwell.jpg',
      decos:[{icon:'ph-lightning',size:52,top:-10,right:58,opacity:0.11,rotate:-5},{icon:'ph-magnet',size:20,top:8,right:118,opacity:0.08,rotate:0},{icon:'ph-plug',size:15,top:62,right:106,opacity:0.07,rotate:10}] },
    { id:4, name:'Optics & Photonics',     icon:'ph-eye',           bannerClass:'tb-4', physicist:'static/physicists/feynman.jpg',
      decos:[{icon:'ph-eye',size:46,top:-8,right:58,opacity:0.11,rotate:0},{icon:'ph-sun',size:22,top:8,right:116,opacity:0.09,rotate:0},{icon:'ph-triangle',size:15,top:62,right:106,opacity:0.07,rotate:0}] },
    { id:5, name:'Basic Electronics',      icon:'ph-circuit-board', bannerClass:'tb-5', physicist:'static/physicists/tesla.jpg',
      decos:[{icon:'ph-circuit-board',size:48,top:-8,right:56,opacity:0.11,rotate:0},{icon:'ph-battery-charging',size:20,top:8,right:116,opacity:0.08,rotate:0},{icon:'ph-cpu',size:15,top:62,right:106,opacity:0.07,rotate:0}] },
    { id:6, name:'Custom Photo', icon:'ph-image', bannerClass:'tb-6', physicist:null, decos:[] },
];

function renderBannerDecos(t, physOpacity) {
    const decos = t.decos.map(d =>
        `<i class="ph-bold ${d.icon}" style="position:absolute;font-size:${d.size}px;top:${d.top}px;right:${d.right}px;opacity:${d.opacity};transform:rotate(${d.rotate}deg);color:white;pointer-events:none;user-select:none;line-height:1;"></i>`
    ).join('');
    const phys = `<img src="${t.physicist}" alt="" style="position:absolute;right:0;top:0;height:100%;width:80px;object-fit:cover;object-position:top center;opacity:${physOpacity};filter:grayscale(100%) contrast(1.1) brightness(1.1);-webkit-mask-image:linear-gradient(to right,transparent 0%,black 52%);mask-image:linear-gradient(to right,transparent 0%,black 52%);pointer-events:none;">`;
    return decos + phys;
}

const activityIcons = {
    pdf:    '<i class="ph-bold ph-file-pdf"></i>',
    manual: '<i class="ph-bold ph-pencil-simple"></i>',
    docx:   '<i class="ph-bold ph-file-doc"></i>',
};
const statusIcons = {
    graded:        '<i class="ph-bold ph-check-circle"></i>',
    late:          '<i class="ph-bold ph-warning"></i>',
    submitted:     '<i class="ph-bold ph-clock"></i>',
    overdue:       '<i class="ph-bold ph-x-circle"></i>',
    not_submitted: '<i class="ph-bold ph-note-pencil"></i>',
};

// ═══ LOAD CLASSES ═══
function skeletonCards(n) {
    return `<div class="db-classes-grid">${Array.from({length:n},()=>`
    <div class="skeleton-card">
      <div class="skeleton-box sk-banner"></div>
      <div class="sk-body">
        <div class="skeleton-box sk-title"></div>
        <div class="skeleton-box sk-sub"></div>
        <div class="skeleton-box sk-sub2"></div>
      </div>
    </div>`).join('')}</div>`;
}
async function loadClasses() {
    document.getElementById('classesList').innerHTML = skeletonCards(4);
    try {
        const data = await fetch('/api/classes/my-classes', {
            headers: { 'Authorization': `Bearer ${token}` }
        }).then(r => r.json());

        const container = document.getElementById('classesList');
        document.getElementById('statClasses').textContent = data.length;

        if (!data.length) {
            container.innerHTML = `<div class="db-empty-state">
                <div style="font-size:44px;color:var(--text-3);margin-bottom:16px;"><i class="ph-bold ph-books"></i></div>
                <p class="db-empty-title">No classes yet</p>
                <p class="db-empty-sub">Ask your professor for a class code to get started.</p>
                <button class="db-empty-btn" onclick="openJoinModal()"><i class="ph-bold ph-sign-in"></i> Join a Class</button>
            </div>`;
            document.getElementById('allActivitiesList').innerHTML =
                '<p style="color:var(--text-3);text-align:center;padding:20px;">Join a class to see activities.</p>';
            document.getElementById('statPending').textContent   = '0';
            document.getElementById('statSubmitted').textContent = '0';
            return;
        }

        data.forEach(c => { _classMap[c.id] = { code: c.class_code, name: c.class_name }; });
        container.innerHTML = `<div class="db-classes-grid">${data.map((c, i) => {
            const t = THEMES[c.theme || 0];
            return `
            <div class="db-class-card fade-up" onclick="navigateTo('/class_detail?id=${c.id}')" style="animation-delay:${i * 0.07}s;position:relative;">
                <div class="cc-banner ${t.bannerClass}"${c.theme === 6 && c.banner_image ? ` style="background:url('${c.banner_image}') center/cover no-repeat,#111;"` : ''}>
                    ${c.theme === 6 && c.banner_image ? '' : renderBannerDecos(t, 0.18)}
                    <div class="cc-menu-wrap"><button class="cc-menu-btn" onclick="openCardMenu(event,${c.id})"><i class="ph-bold ph-dots-three-vertical"></i></button></div>
                </div>
                <div class="cc-card-body">
                    <div class="cc-class-name">${c.class_name}</div>
                    <div class="cc-class-sub">${c.subject}</div>
                    <div class="cc-class-section">${c.section}</div>
                    <div class="cc-card-footer">
                        <span class="cc-prof"><i class="ph-bold ph-chalkboard-teacher"></i> ${c.professor_name}</span>
                        <span class="cc-arrow"><i class="ph-bold ph-arrow-right"></i></span>
                    </div>
                </div>
            </div>`}).join('')}</div>`;
        if (typeof observeFade === 'function') observeFade(container);

        const ids = data.map(c => c.id);
        loadAllActivities(ids);

    } catch {
        showToast('Cannot load classes. Check your connection!', 'error');
        document.getElementById('classesList').innerHTML =
            '<p style="color:#fca5a5;text-align:center;padding:20px;">Cannot load classes.</p>';
    }
}

// ═══ LOAD ACTIVITIES ═══
async function loadAllActivities(classIds) {
    const container = document.getElementById('allActivitiesList');
    try {
        const allActivities = (await Promise.all(
            classIds.map(id => fetch(`/api/activities/${id}`, {
                headers: { 'Authorization': `Bearer ${token}` }
            }).then(r => r.json()))
        )).flat();

        if (!allActivities.length) {
            document.getElementById('statPending').textContent   = '0';
            document.getElementById('statSubmitted').textContent = '0';
            container.innerHTML = `<div class="db-empty-state">
                <div style="font-size:44px;color:var(--text-3);margin-bottom:16px;"><i class="ph-bold ph-clipboard-text"></i></div>
                <p class="db-empty-title">No activities yet</p>
                <p class="db-empty-sub">Your professor hasn't posted any activities yet.</p>
            </div>`;
            return;
        }

        const submissions = await Promise.all(
            allActivities.map(a => fetch(`/api/submissions/${a.id}/my-submission`, {
                headers: { 'Authorization': `Bearer ${token}` }
            }).then(r => r.ok ? r.json() : null).catch(() => null))
        );

        let pendingCount = 0, submittedCount = 0;
        const html = allActivities.map((a, i) => {
            const sub = submissions[i];
            const now = new Date();
            const dueDate = a.due_date ? new Date(a.due_date) : null;
            const isOverdue = dueDate && dueDate < now;

            let statusHtml = '';
            if (sub && sub.status === 'graded') {
                statusHtml = `<span class="status-badge status-graded">${statusIcons.graded} Graded</span>`;
                submittedCount++;
            } else if (sub && sub.status === 'submitted') {
                const isLate = dueDate && new Date(sub.submitted_at) > dueDate;
                statusHtml = isLate
                    ? `<span class="status-badge status-late">${statusIcons.late} Late</span>`
                    : `<span class="status-badge status-submitted">${statusIcons.submitted} Pending</span>`;
                submittedCount++;
            } else if (isOverdue) {
                statusHtml = `<span class="status-badge status-overdue">${statusIcons.overdue} Overdue</span>`;
                pendingCount++;
            } else {
                statusHtml = `<span class="status-badge status-not-submitted">${statusIcons.not_submitted} Not Submitted</span>`;
                pendingCount++;
            }

            const gradeHtml = (sub?.grade !== null && sub?.grade !== undefined)
                ? `<span class="grade-pill">${sub.grade}/100</span>` : '';
            const dueHtml = dueDate
                ? `<div class="due-info ${isOverdue ? 'overdue' : ''}"><i class="ph-bold ph-calendar"></i> Due: ${a.due_date_display}</div>` : '';

            return `<div class="activity-item" onclick="navigateTo('/activity?id=${a.id}')">
                <div class="activity-icon">${activityIcons[a.file_type] || activityIcons.docx}</div>
                <div class="activity-info">
                    <strong>${a.title}</strong>
                    <p>${a.file_type.toUpperCase()} &bull; ${a.created_at}</p>
                    ${dueHtml}
                </div>
                <div class="activity-right">${statusHtml}${gradeHtml}</div>
            </div>`;
        }).join('');

        document.getElementById('statPending').textContent   = pendingCount;
        document.getElementById('statSubmitted').textContent = submittedCount;
        container.innerHTML = html;

    } catch {
        showToast('Cannot load activities!', 'error');
        container.innerHTML = '<p style="color:#fca5a5;text-align:center;padding:20px;">Cannot load activities.</p>';
    }
}

// ═══ JOIN CLASS MODAL ═══
function openJoinModal() {
    document.getElementById('class_code').value = '';
    document.getElementById('joinModal').classList.add('open');
    setTimeout(() => document.getElementById('class_code').focus(), 80);
}
function closeJoinModal() {
    document.getElementById('joinModal').classList.remove('open');
}
function onJoinOverlayClick(e) {
    if (e.target === document.getElementById('joinModal')) closeJoinModal();
}

async function confirmJoin() {
    const class_code = document.getElementById('class_code').value.trim().toUpperCase();
    if (!class_code) { showToast('Please enter a class code!', 'warning'); return; }

    const btn = document.getElementById('joinBtn');
    btn.disabled = true; btn.querySelector('.button_text').innerHTML = '<i class="ph-bold ph-spinner"></i> Joining...';

    try {
        const res  = await fetch('/api/classes/join', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
            body: JSON.stringify({ class_code })
        });
        const data = await res.json();
        if (res.ok) {
            closeJoinModal();
            showToast(data.message, 'success');
            loadClasses();
        } else {
            showToast(data.message || 'Cannot join class!', 'error');
        }
    } catch {
        showToast('Cannot connect to server!', 'error');
    } finally {
        btn.disabled = false; btn.querySelector('.button_text').innerHTML = '<i class="ph-bold ph-sign-in"></i> Join Class';
    }
}

loadClasses();

// ═══ REAL-TIME CLASS UPDATES ═══
(function() {
    const socket = io();
    socket.on('class_update', function() {
        loadClasses();
    });
})();
</script>
