function sbKatexBlock(eq) {
    try { return window.katex ? katex.renderToString(eq.trim(), { displayMode: true,  throwOnError: false }) : `\\[${eq}\\]`; }
    catch { return `\\[${eq}\\]`; }
}
function sbKatexInline(eq) {
    try { return window.katex ? katex.renderToString(eq.trim(), { displayMode: false, throwOnError: false }) : `\\(${eq}\\)`; }
    catch { return `\\(${eq}\\)`; }
}
function sbApplyKatex(html) {
    if (!html || !window.katex) return html;
    html = html.replace(/<p[^>]*>\s*(\\\[[\s\S]*?\\\])\s*<\/p>/g, (_, inner) => {
        const eq = inner.replace(/^\s*\\\[/,'').replace(/\\\]\s*$/,'').trim();
        return `<div style="text-align:center;margin:14px 0;">${sbKatexBlock(eq)}</div>`;
    });
    html = html.replace(/\\\[([^\]]*(?:\][^\]]*)*?)\\\]/g, (_, eq) =>
        `<div style="text-align:center;margin:14px 0;">${sbKatexBlock(eq)}</div>`);
    html = html.replace(/\\\((.+?)\\\)/gs, (_, eq) => sbKatexInline(eq));
    return html;
}
function sbRenderEq(text) {
    if (!text || !window.katex) return text;
    const segs = text.split(/(\\\[[\s\S]*?\\\]|\\\([\s\S]*?\\\))/g);
    return segs.map((seg, i) => {
        if (i % 2 === 1) {
            if (seg.startsWith('\\[')) return `<span style="display:block;text-align:center;margin:14px 0;">${sbKatexBlock(seg.slice(2,-2).trim())}</span>`;
            return sbKatexInline(seg.slice(2,-2).trim());
        }
        return seg;
    }).join('');
}

function sbSnapTable(tbl, tblIdx, tableData, sectionType) {
    const rows  = Array.isArray(tbl) ? tbl : (tbl.rows || []);
    const title = Array.isArray(tbl) ? '' : (tbl.title || '');
    if (!rows.length) return '';
    let html = `<div class="av-table-block">
        ${title ? `<div class="av-table-bar"><span class="av-table-title-text">${sbRenderEq(title)}</span></div>` : ''}
        <div class="av-table-scroll"><table class="av-data-table">`;
    rows.forEach((row, rIdx) => {
        const cells = Array.isArray(row) ? row : [row];
        html += '<tr>';
        cells.forEach((cell, cIdx) => {
            const obj  = (cell && typeof cell === 'object') ? cell : null;
            const raw  = (obj ? String(obj.value || '') : String(cell || ''));
            const span = [(obj && obj.colspan > 1 ? ` colspan="${obj.colspan}"` : ''), (obj && obj.rowspan > 1 ? ` rowspan="${obj.rowspan}"` : '')].join('');
            const inline = raw.replace(/\\\[([\s\S]*?)\\\]/g,'\\($1\\)');
            const rendered = (inline.includes('\\(') || inline.includes('\\[')) ? sbRenderEq(inline) : inline;
            if ((obj && obj.type === 'header') || (rendered !== inline && raw)) {
                html += `<th${span} class="av-tbl-readonly-cell"><span class="av-tbl-header-text">${rendered}</span></th>`;
            } else if (obj && obj.type === 'text' && raw) {
                html += `<td${span} class="av-tbl-label-cell"><span>${rendered}</span></td>`;
            } else {
                const sKey = sectionType ? `${sectionType}:${tblIdx}` : String(tblIdx);
                const saved = tableData?.[sKey]?.[String(rIdx)]?.[String(cIdx)]
                           ?? tableData?.[String(tblIdx)]?.[String(rIdx)]?.[String(cIdx)]
                           ?? tableData?.[String(rIdx)]?.[String(cIdx)] ?? '';
                html += `<td${span}><span style="display:block;padding:6px 10px;font-size:12px;color:var(--text-2);min-width:80px;font-family:'DM Sans',sans-serif;text-align:center;">${saved || '—'}</span></td>`;
            }
        });
        html += '</tr>';
    });
    html += `</table></div></div>`;
    return html;
}

function sbBuildIntro(content) {
    if (!content?.length) return '';
    let html = '', listBuf = [];
    function flush() {
        if (!listBuf.length) return;
        html += listBuf.map(it => {
            const pad = 1.5 + (it.level||0)*1.8;
            const lbl = it.label || (it.list_type === 'bullet' ? '•' : '');
            return `<p style="margin-left:${pad}em;margin-top:2px;margin-bottom:2px;">${lbl?lbl+' ':''}${sbApplyKatex(it.text)}</p>`;
        }).join('');
        listBuf = [];
    }
    for (const item of content) {
        if (item.type === 'list_item') { listBuf.push(item); continue; }
        flush();
        if (item.type === 'display_equation') {
            const eq = item.text.replace(/^\s*\\\[/,'').replace(/\\\]\s*$/,'').trim();
            html += `<div style="text-align:center;margin:14px 0;">${sbKatexBlock(eq)}</div>`;
        } else if (item.type === 'image' && item.src) {
            html += `<div style="text-align:center;margin:10px 0;"><img src="${item.src}" style="max-width:100%;border-radius:8px;">${item.caption?`<p style="text-align:center;font-size:12px;color:var(--text-3);margin-top:4px;"><em>${item.caption}</em></p>`:''}</div>`;
        } else if (item.type === 'spacing') {
            html += '<p><br></p>';
        } else if (item.type === 'sub_header') {
            const al = item.align ? ` style="text-align:${item.align};"` : '';
            html += `<h3${al}>${item.text}</h3>`;
        } else if (item.type === 'table') {
            html += `<div style="display:flex;justify-content:center;">${sbSnapTable(item, 0, {})}</div>`;
        } else if (item.text) {
            if (item.text.trim().startsWith('<')) { html += sbApplyKatex(item.text); continue; }
            html += `<p style="text-align:justify;">${sbApplyKatex(item.text)}</p>`;
        }
    }
    flush();
    return html;
}

function sbBuildProcedures(content, tableData) {
    if (!content?.length) return '';
    const td = tableData || {};
    const hasSteps = content.some(c => c.type === 'step' || c.step_number);
    let tblIdx = 0, stepNum = 0;
    return `<div class="av-procedures-list">${content.map(c => {
        if (c.type === 'sub_header') { stepNum = 0; return `<div class="av-sub-header">${c.text}</div>`; }
        if (c.type === 'computation_space') return `<div class="av-computation-space"><i class="ph-bold ph-pencil-simple"></i> Show computations here</div>`;
        if (c.type === 'graph_attachment') return `<div class="av-graph-attachment"><i class="ph-bold ph-chart-line"></i> Attach graph below</div>`;
        if (c.type === 'table') return sbSnapTable(c, tblIdx++, td, 'procedures');
        if (c.type === 'step' || c.step_number) {
            const tbls = (c.inline_tables||(c.inline_table?[c.inline_table]:[])).map(t=>sbSnapTable(t,tblIdx++,td,'procedures')).join('');
            return `<div class="av-procedure-step"><div class="av-step-num">${++stepNum}.</div><div class="av-step-text">${c.instruction||c.text||''}${tbls}</div></div>`;
        }
        if (c.text?.trim().startsWith('<')) return `<div class="av-text-block">${c.text}</div>`;
        const txt = (c.text||'').trim();
        if (!txt) return '';
        if (hasSteps) return `<div class="av-procedure-step"><div class="av-step-num">${++stepNum}.</div><div class="av-step-text">${txt}</div></div>`;
        return `<p class="av-step-intro">${txt}</p>`;
    }).join('')}</div>`;
}

function sbBuildDataSheet(section, tableData, answers) {
    // Prefer view_html snapshot — it has field rows, comp blocks, headers, tables
    if (section.view_html) {
        const wrap = document.createElement('div');
        wrap.innerHTML = section.view_html;

        // Table cell inputs → readonly span
        wrap.querySelectorAll('.data-table-input').forEach(inp => {
            const t = inp.dataset.tbl, r = inp.dataset.row, c = inp.dataset.col;
            const scopedKey = `data_sheet:${t}`;
            const val = tableData?.[scopedKey]?.[r]?.[c]
                     ?? tableData?.[String(t)]?.[r]?.[c] ?? '';
            const span = document.createElement('span');
            span.style.cssText = 'display:block;padding:6px 10px;font-size:12px;color:var(--text-2);min-width:80px;font-family:\'DM Sans\',sans-serif;text-align:center;';
            span.textContent = val || '—';
            inp.parentNode.replaceChild(span, inp);
        });

        // Attach blocks — populate images + note before generic answer-textarea sweep
        wrap.querySelectorAll('.av-ds-attach-block').forEach(block => {
            const zone = block.querySelector('.av-ds-attach-zone');
            const idx  = zone?.dataset.index;
            if (!idx) return;
            if (zone) zone.style.display = 'none';

            const imgs       = block.querySelector('.av-ds-attach-imgs');
            const savedFiles = answers?.[`${idx}_imgs`];
            if (imgs) {
                if (Array.isArray(savedFiles) && savedFiles.length) {
                    imgs.innerHTML = savedFiles.map(f => {
                        const fname = f.file || f;
                        const oname = (f.name || fname).replace(/'/g, "\\'");
                        const url   = `/api/submissions/file/${fname}`;
                        return `<div onclick="_sbOpenFileModal('${url}',false,'${oname}')"
                            style="display:flex;align-items:center;gap:10px;padding:10px 12px;
                            border:1.5px solid var(--border);border-radius:10px;background:var(--surface);
                            cursor:pointer;transition:border-color 0.15s;margin-bottom:4px;"
                            onmouseover="this.style.borderColor='var(--primary)'"
                            onmouseout="this.style.borderColor='var(--border)'">
                            <i class="ph-bold ph-image" style="font-size:20px;color:#0a66c2;flex-shrink:0;"></i>
                            <span style="font-size:13px;font-weight:600;color:var(--text-1);flex:1;word-break:break-all;font-family:'DM Sans',sans-serif;">${f.name || fname}</span>
                            <i class="ph-bold ph-caret-right" style="color:var(--text-3);font-size:16px;flex-shrink:0;"></i>
                        </div>`;
                    }).join('');
                } else {
                    imgs.innerHTML = '<p style="font-size:12px;color:var(--text-3);font-family:\'DM Sans\',sans-serif;text-align:center;padding:6px 0;margin:0;">No image attached</p>';
                }
            }

            // Note textarea — replace with styled block, mark as handled
            const noteEl  = block.querySelector('.av-ds-attach-note');
            if (noteEl) {
                const noteVal = answers?.[noteEl.dataset.index] ?? '';
                if (noteVal) {
                    const noteDiv = document.createElement('div');
                    noteDiv.style.cssText = 'margin-top:8px;padding:8px 12px;background:var(--input-bg);border-radius:8px;font-size:13px;color:var(--text-2);font-family:\'DM Sans\',sans-serif;line-height:1.5;';
                    noteDiv.textContent = noteVal;
                    noteEl.parentNode.replaceChild(noteDiv, noteEl);
                } else {
                    noteEl.remove();
                }
            }
        });

        // Field row inputs + comp/attach textareas → readonly span
        wrap.querySelectorAll('.answer-textarea').forEach(el => {
            const idx = el.dataset.index;
            const val = answers?.[idx] ?? '';
            const span = document.createElement('span');
            span.style.cssText = 'display:inline-block;min-width:80px;padding:2px 8px;border-bottom:1.5px solid var(--border);font-size:13px;color:var(--text);font-family:\'DM Sans\',sans-serif;';
            span.textContent = val || '—';
            el.parentNode.replaceChild(span, el);
        });

        // Disable any remaining inputs
        wrap.querySelectorAll('input,textarea,select').forEach(el => { el.disabled = true; });

        if (tableData?.notes) wrap.innerHTML += `<div style="margin-top:10px;padding:10px 14px;background:var(--input-bg);border-radius:10px;font-size:13px;color:var(--text-2);font-family:'DM Sans',sans-serif;"><strong>Notes:</strong> ${tableData.notes}</div>`;
        return wrap.innerHTML;
    }

    // Fallback: rebuild from structured content
    let tblIdx = 0, html = '';
    const content = section.content || [];
    for (let i = 0; i < content.length; i++) {
        const c = content[i], nxt = content[i+1];
        if (c.type === 'table') { html += sbSnapTable(c, tblIdx++, tableData); continue; }
        if (!c.text || c.text === '<p><br></p>') continue;
        if (nxt?.type === 'table' && !nxt.title) {
            const plain = c.text.replace(/<[^>]*>/g,'').trim();
            if (plain) { html += sbSnapTable({...nxt,title:plain}, tblIdx++, tableData); i++; continue; }
        }
        html += c.text.trim().startsWith('<') ? `<div class="av-text-block">${c.text}</div>` : `<p class="av-text-block">${c.text}</p>`;
    }
    if (tblIdx === 0 && parsedActivity?.tables?.length) {
        parsedActivity.tables.forEach((tbl, ti) => { html += sbSnapTable(tbl, ti, tableData); });
    }
    if (tableData?.notes) html += `<div style="margin-top:10px;padding:10px 14px;background:var(--input-bg);border-radius:10px;font-size:13px;color:var(--text-2);font-family:'DM Sans',sans-serif;"><strong>Notes:</strong> ${tableData.notes}</div>`;
    return html;
}

function sbBuildGuideQuestions(content, answers, tableData) {
    const td = tableData || {};
    let qCounter = 0, tblIdx = 0, fbCounter = 0;
    const items = [];
    for (let i = 0; i < content.length; i++) {
        const c = content[i], nxt = content[i+1];
        if (nxt?.type === 'table' && !nxt.title && c.text) {
            const plain = c.text.replace(/<[^>]*>/g,'').trim();
            if (plain) { items.push({...nxt,title:plain}); i++; continue; }
        }
        items.push(c);
    }
    return items.map(c => {
        if (c.type === 'image' && c.src) return `<div style="text-align:center;margin:10px 0;"><img src="${c.src}" style="max-width:80%;border-radius:8px;"></div>`;
        if (c.type === 'table') return sbSnapTable(c, tblIdx++, td, 'guide_questions');
        if (c.type === 'text' && !c.question_number) return `<p class="av-step-intro" style="padding:4px 0;">${c.text||''}</p>`;
        if (c.type === 'fill_blank') {
            const idx = fbCounter++;
            const ans = answers?.[`fb_${idx}`] ?? '';
            return `<div class="av-fill-blank">
                <span style="display:inline-block;min-width:60px;border-bottom:1.5px solid var(--primary-l);text-align:center;padding:2px 8px;font-size:13px;color:var(--text);">${ans||'&nbsp;&nbsp;&nbsp;'}</span>
                ${c.number?`<span class="av-fill-blank-num">${c.number}</span>`:''}
                <span>${c.text||''}</span>
            </div>`;
        }
        if (c.type === 'sub_question') {
            const idx = qCounter++;
            const ans = answers?.[String(idx)] ?? answers?.[idx] ?? '';
            return `<div class="av-sub-question">
                <span class="av-sub-q-label">${/[\.\)]$/.test(c.label)?c.label:c.label+'.'}</span>
                <div class="av-sub-q-body">
                    <span>${c.text||''}</span>
                    ${ans ? `<div class="sb-view-answer">${ans}</div>` : `<div class="sb-no-answer">No answer provided.</div>`}
                </div>
            </div>`;
        }
        const qNum  = c.question_number || (qCounter + 1);
        const qText = c.question || c.text || '';
        if (!qText) return '';
        const ansIdx = qCounter++;
        const ans = answers?.[String(ansIdx)] ?? answers?.[ansIdx] ?? '';
        const tbls = (c.inline_tables||(c.inline_table?[c.inline_table]:[])).map(t=>sbSnapTable(t,tblIdx++,td,'guide_questions')).join('');
        return `<div class="av-question-item">
            <div class="av-question-text"><strong>${qNum}.</strong>&nbsp;<span class="av-q-body">${sbApplyKatex(qText)}</span></div>
            ${tbls}
            ${ans ? `<div class="sb-view-answer">${ans}</div>` : `<div class="sb-no-answer">No answer provided.</div>`}
        </div>`;
    }).join('');
}

function sbBuildSection(section, sub, sectionIdx) {
    const type = section.type;
    const content = section.content || [];
    const meta = SB_SECTION_META[type] || { icon: '<i class="ph-bold ph-file-text"></i>', iconClass: 'av-icon-slate', label: section.title || type };

    if (type === 'lab_title') {
        const labNum   = section.title || 'LABORATORY ACTIVITY';
        const labTitle = content.map(c => (c.text||'').replace(/<[^>]*>/g,'').trim()).filter(Boolean).join(' ');
        return `<div class="av-lab-header" style="margin-bottom:16px;">
            <div class="av-lab-badge"><i class="ph-bold ph-flask"></i> ${labNum}</div>
            ${labTitle ? `<h2 class="av-lab-title-text" style="margin:8px 0 0;">${labTitle}</h2>` : ''}
        </div>`;
    }

    let bodyHtml = '';
    if (type === 'introduction') {
        bodyHtml = `<div class="intro-preview-wrap">${sbBuildIntro(content)}</div>`;
    } else if (type === 'outcomes') {
        const introItem = content.find(c => c.type === 'outcome_intro');
        const items = content.filter(c => c.type !== 'outcome_intro');
        bodyHtml = (introItem ? `<p class="av-text-block" style="margin-bottom:10px;">${introItem.text}</p>` : '') +
            `<ol class="av-numbered-list">${items.map((c,i) =>
                `<li><span>${c.text||c.outcome||''}</span></li>`
            ).join('')}</ol>`;
    } else if (type === 'materials') {
        const checked = sub.materials_checked || {};
        bodyHtml = `<div class="av-materials-list">${content.map((c,i) => {
            if (c.is_checkbox || c.item) {
                const isChk = checked[String(i)] || checked[i];
                return `<div class="av-material-item">
                    <input type="checkbox" class="av-material-check" ${isChk ? 'checked' : ''} disabled>
                    <span>${c.item||c.text||''}</span>
                </div>`;
            }
            if (c.note || c.text) return `<div class="av-material-note"><i class="ph-bold ph-push-pin"></i> <span>${c.note||c.text}</span></div>`;
            return '';
        }).join('')}</div>`;
    } else if (type === 'procedures') {
        bodyHtml = sbBuildProcedures(content, sub.table_data || {});
    } else if (type === 'data_sheet') {
        bodyHtml = sbBuildDataSheet(section, sub.table_data || {}, sub.answers || {});
    } else if (type === 'guide_questions') {
        bodyHtml = sbBuildGuideQuestions(content, sub.answers || {}, sub.table_data || {});
    } else if (type === 'references') {
        bodyHtml = `<div class="av-references-list">${content.map(c =>
            c.text ? `<div class="av-reference-item"><span>${c.text}</span></div>` : ''
        ).join('')}</div>`;
    } else if (type === 'student_info') {
        const info       = sub.student_info || {};
        const members    = info.members || [];
        const attendance = info.attendance || {};
        const leaderIdx  = info.leader_index ?? -1;
        const groupNum   = info.group_number || info.group_id;
        const groupName  = info.group_name || '';
        let si = '';
        if (groupNum) {
            si += `<div class="sb-si-group-banner">
                <span class="sb-si-group-badge"><i class="ph-bold ph-circles-three"></i> Group ${groupNum}</span>
                ${groupName ? `<span class="sb-si-group-info"><strong>${groupName}</strong></span>` : ''}
                <span class="sb-si-group-info">${members.length} member${members.length !== 1 ? 's' : ''}</span>
            </div>`;
        }
        si += `<div class="sb-si-member-grid">`;
        members.forEach((m, i) => {
            const name        = typeof m === 'string' ? m : (m.full_name || m.name || 'Unknown');
            const avatarSrc   = typeof m === 'object' ? (m.avatar || null) : null;
            const memberId    = typeof m === 'object' ? m.id : null;
            const isLeader    = leaderIdx === i;
            const contribData = memberId ? (info.contributions?.[String(memberId)]) : null;
            const contributed = attendance[i] !== 'absent' && attendance[String(i)] !== 'absent';
            const avatarHtml  = avatarSrc ? makePhotoAvatar(avatarSrc, 36, '50%') : makeInitialsAvatar(name, 36, '50%', 13);

            let contribBadge;
            if (contribData) {
                const c = contribData.count || 0, p = contribData.pct || 0;
                const col = p >= 30 ? '#22c55e' : p > 0 ? '#f59e0b' : '#94a3b8';
                contribBadge = `<span class="sb-si-contrib" style="color:${col};background:${col}18;">
                    <i class="ph-bold ph-chart-bar"></i> ${c} field${c !== 1 ? 's' : ''} (${p}%)
                </span>`;
            } else {
                contribBadge = `<span class="sb-si-contrib ${contributed ? 'yes' : 'no'}">
                    <i class="ph-bold ${contributed ? 'ph-check-circle' : 'ph-x-circle'}"></i>
                    ${contributed ? 'Contributed' : 'Did not contribute'}
                </span>`;
            }

            si += `<div class="sb-si-member-row ${isLeader ? 'is-leader' : ''}">
                ${avatarHtml}
                <div class="sb-si-member-info">
                    <div class="sb-si-member-name">${name}</div>
                    <div class="sb-si-badges">
                        ${isLeader
                            ? `<span class="sb-si-badge-leader"><i class="ph-bold ph-crown-simple"></i> Leader</span>`
                            : `<span class="sb-si-badge-member"><i class="ph-bold ph-user"></i> Member</span>`}
                        ${contribBadge}
                    </div>
                </div>
            </div>`;
        });
        si += `</div>`;
        if (info.section || info.date) {
            si += `<div class="sb-si-meta-row">
                ${info.section ? `<div class="sb-si-meta-chip"><i class="ph-bold ph-tag"></i> ${info.section}</div>` : ''}
                ${info.date    ? `<div class="sb-si-meta-chip"><i class="ph-bold ph-calendar"></i> ${info.date}</div>` : ''}
            </div>`;
        }
        bodyHtml = si;
    } else if (type === 'rubric') {
        const rd = section.rubric;
        if (rd?.columns?.length && rd?.criteria?.length) {
            const cols = rd.columns;
            const crit = rd.criteria;
            const saved = sub.rubric_scores || {};
            const maxTotal = Math.max(...cols.map(c => Number(c.points) || 0)) * crit.length;

            let th = `<th class="av-rubric-th av-rubric-criteria-col">Criteria</th>`;
            cols.forEach((c, ci) => {
                th += `<th class="av-rubric-th">${c.label || ''}<br><span class="av-rubric-pts-label">${c.points} pt${c.points !== 1 ? 's' : ''}</span></th>`;
            });

            let rows = '';
            crit.forEach((cr, ri) => {
                const selectedCol = saved[String(ri)] !== undefined ? parseInt(saved[String(ri)]) : -1;
                let tds = `<td class="av-rubric-td av-rubric-criteria-name">${cr.name || ''}</td>`;
                cols.forEach((col, ci) => {
                    const isSelected = ci === selectedCol;
                    tds += `<td class="av-rubric-td av-rubric-desc sb-rubric-cell${isSelected ? ' sb-rubric-selected' : ''}"
                        onclick="sbRubricSelect(${ri},${ci})"
                        data-ri="${ri}" data-ci="${ci}">${(cr.descriptions || [])[ci] || ''}</td>`;
                });
                rows += `<tr>${tds}</tr>`;
            });

            // Compute current total
            let currentTotal = 0;
            crit.forEach((_, ri) => {
                const ci = saved[String(ri)] !== undefined ? parseInt(saved[String(ri)]) : -1;
                if (ci >= 0) currentTotal += Number(cols[ci]?.points || 0);
            });
            const currentPct = maxTotal > 0 ? Math.round((currentTotal / maxTotal) * 100) : 0;

            bodyHtml = `<div class="sb-rubric-wrap">
                <div class="sb-rubric-hint">Click a cell to select the rating for each criterion.</div>
                <div class="av-rubric-wrap">
                    <table class="av-rubric-table" id="sbRubricTable">
                        <thead><tr>${th}</tr></thead>
                        <tbody>${rows}</tbody>
                        <tfoot><tr>
                            <td class="av-rubric-td av-rubric-total-label">Max Points</td>
                            ${cols.map(c => `<td class="av-rubric-td av-rubric-total-pts">${c.points}</td>`).join('')}
                        </tr></tfoot>
                    </table>
                </div>
                <div class="sb-rubric-score-row">
                    <span class="sb-rubric-score-label">Rubric Score:</span>
                    <span class="sb-rubric-score-val" id="sbRubricScore">${currentTotal}</span>
                    <span class="sb-rubric-score-denom">/ ${maxTotal}</span>
                    <span class="sb-rubric-pct" id="sbRubricPct">= ${currentPct}/100</span>
                    <button class="sb-rubric-apply-btn" onclick="sbRubricApplyGrade()">
                        <i class="ph-bold ph-arrow-right"></i> Apply to Grade
                    </button>
                </div>
                <button class="sb-rubric-save-btn" id="sbRubricSaveBtn" onclick="sbRubricSave(${sub.id})">
                    <i class="ph-bold ph-floppy-disk"></i> Save Rubric Scores
                </button>
            </div>`;
        }
    } else if (type === 'peer_assessment') {
        const pa = section.peer_assessment;
        if (pa?.criteria?.length) {
            const groupId  = sub.group_id;
            const criteria = pa.criteria;

            // All group members (every student that has a submission in this group)
            const allMembers = allSubmissions
                .filter(s => !groupId || s.group_id === groupId)
                .map(s => ({ id: String(s.student_id), name: s.student_name || 'Unknown', sub: s }));

            const memberAccordions = allMembers.map(member => {
                const sid   = member.id;
                const sname = member.name;
                const msub  = member.sub;

                // ── Given by this member ──────────────────────────────────
                const givenRatings = msub.peer_assessments || {};
                const otherMembers = allMembers.filter(m => m.id !== sid);
                let givenInner = '';
                if (otherMembers.length) {
                    const accItems = otherMembers.map(m => {
                        const mid   = m.id;
                        const mname = m.name;
                        const given = givenRatings[mid];
                        if (!given) {
                            return `<div class="sb-pa-acc-item">
                                <div class="sb-pa-acc-header sb-pa-acc-no-rating">
                                    <span class="sb-pa-acc-name"><i class="ph-bold ph-user"></i> ${mname}</span>
                                    <span class="sb-pa-acc-no-label">No rating</span>
                                </div>
                            </div>`;
                        }
                        const scores = criteria.map((cr, ci) => ({ label: cr.label, val: given[String(ci)] ?? null }));
                        const nums   = scores.map(s => s.val).filter(v => v !== null && !isNaN(Number(v))).map(Number);
                        const avg    = nums.length ? Math.round(nums.reduce((a,b)=>a+b,0)/nums.length) : null;
                        const avgCol = avg !== null ? (avg >= 75 ? '#22c55e' : avg >= 50 ? '#f59e0b' : '#ef4444') : 'var(--text-3)';
                        const detailRows = scores.map(s => {
                            const v = s.val !== null ? Number(s.val) : null;
                            const c = v !== null ? (v >= 75 ? '#22c55e' : v >= 50 ? '#f59e0b' : '#ef4444') : 'var(--text-3)';
                            return `<tr>
                                <td class="sb-pa-td sb-pa-criterion">${s.label}</td>
                                <td class="sb-pa-td sb-pa-bar-cell">
                                    ${v !== null ? `<div class="sb-pa-bar-wrap"><div class="sb-pa-bar-fill" style="width:${Math.max(2,v)}%;background:${c};"></div></div>` : '<span style="color:var(--text-3);font-size:12px;">—</span>'}
                                </td>
                                <td class="sb-pa-td sb-pa-score" style="color:${c};">${v !== null ? v + '%' : '—'}</td>
                            </tr>`;
                        }).join('');
                        return `<div class="sb-pa-acc-item">
                            <div class="sb-pa-acc-header" onclick="sbPaToggle(this)">
                                <span class="sb-pa-acc-name"><i class="ph-bold ph-user"></i> ${mname}</span>
                                ${avg !== null ? `<span class="sb-pa-acc-avg" style="color:${avgCol};">${avg}%</span>` : ''}
                                <i class="ph-bold ph-caret-down sb-pa-acc-caret"></i>
                            </div>
                            <div class="sb-pa-acc-body">
                                <table class="sb-pa-table">
                                    <thead><tr>
                                        <th class="sb-pa-th sb-pa-criterion">Criterion</th>
                                        <th class="sb-pa-th sb-pa-bar-cell">Rating</th>
                                        <th class="sb-pa-th sb-pa-score">Score</th>
                                    </tr></thead>
                                    <tbody>${detailRows}</tbody>
                                </table>
                            </div>
                        </div>`;
                    }).join('');
                    givenInner = `<div class="sb-pa-subsection">
                        <div class="sb-pa-sub-label"><i class="ph-bold ph-pencil-simple"></i> Ratings given</div>
                        <div class="sb-pa-accordion">${accItems}</div>
                    </div>`;
                } else {
                    givenInner = `<div class="sb-pa-subsection">
                        <div class="sb-pa-sub-label"><i class="ph-bold ph-pencil-simple"></i> Ratings given</div>
                        <p style="font-size:12px;color:var(--text-3);margin:4px 0 0;">No other members.</p>
                    </div>`;
                }

                // ── Received by this member ───────────────────────────────
                const ratingsPerCriterion = criteria.map(() => []);
                allSubmissions.forEach(other => {
                    if (String(other.student_id) === sid) return;
                    if (groupId && other.group_id !== groupId) return;
                    const ratings = other.peer_assessments;
                    if (!ratings || !ratings[sid]) return;
                    criteria.forEach((cr, ci) => {
                        const val = ratings[sid][String(ci)];
                        if (val !== undefined && val !== null && val !== '') {
                            ratingsPerCriterion[ci].push(Number(val));
                        }
                    });
                });
                const hasReceived = ratingsPerCriterion.some(arr => arr.length > 0);
                let receivedInner = '';
                if (!hasReceived) {
                    receivedInner = `<p style="font-size:12px;color:var(--text-3);margin:4px 0 0;">No ratings received yet.</p>`;
                } else {
                    const rows = criteria.map((cr, ci) => {
                        const vals = ratingsPerCriterion[ci];
                        if (!vals.length) return `<tr>
                            <td class="sb-pa-td sb-pa-criterion">${cr.label}</td>
                            <td class="sb-pa-td sb-pa-bar-cell" colspan="2" style="color:var(--text-3);font-size:12px;">No ratings yet</td>
                        </tr>`;
                        const avg = Math.round(vals.reduce((a,b) => a+b, 0) / vals.length);
                        const col = avg >= 75 ? '#22c55e' : avg >= 50 ? '#f59e0b' : '#ef4444';
                        return `<tr>
                            <td class="sb-pa-td sb-pa-criterion">${cr.label}</td>
                            <td class="sb-pa-td sb-pa-bar-cell">
                                <div class="sb-pa-bar-wrap"><div class="sb-pa-bar-fill" style="width:${Math.max(2,avg)}%;background:${col};"></div></div>
                            </td>
                            <td class="sb-pa-td sb-pa-score" style="color:${col};">${avg}%
                                <span class="sb-pa-raters">(${vals.length} rater${vals.length !== 1 ? 's' : ''})</span>
                            </td>
                        </tr>`;
                    }).join('');
                    const allVals    = ratingsPerCriterion.flat();
                    const overallAvg = allVals.length ? Math.round(allVals.reduce((a,b)=>a+b,0)/allVals.length) : null;
                    const overallCol = overallAvg >= 75 ? '#22c55e' : overallAvg >= 50 ? '#f59e0b' : '#ef4444';
                    receivedInner = `<table class="sb-pa-table" style="margin-top:4px;">
                        <thead><tr>
                            <th class="sb-pa-th sb-pa-criterion">Criterion</th>
                            <th class="sb-pa-th sb-pa-bar-cell">Rating</th>
                            <th class="sb-pa-th sb-pa-score">Avg</th>
                        </tr></thead>
                        <tbody>${rows}</tbody>
                        ${overallAvg !== null ? `<tfoot><tr>
                            <td class="sb-pa-td sb-pa-criterion" style="font-weight:700;">Overall</td>
                            <td class="sb-pa-td sb-pa-bar-cell">
                                <div class="sb-pa-bar-wrap"><div class="sb-pa-bar-fill" style="width:${overallAvg}%;background:${overallCol};"></div></div>
                            </td>
                            <td class="sb-pa-td sb-pa-score" style="color:${overallCol};font-weight:700;">${overallAvg}%</td>
                        </tr></tfoot>` : ''}
                    </table>`;
                }

                return `<div class="sb-pa-member-item">
                    <div class="sb-pa-member-header" onclick="sbPaMemberToggle(this)">
                        <span class="sb-pa-member-name"><i class="ph-bold ph-user"></i> ${sname}</span>
                        <i class="ph-bold ph-caret-down sb-pa-acc-caret"></i>
                    </div>
                    <div class="sb-pa-member-body">
                        ${givenInner}
                        <div class="sb-pa-subsection">
                            <div class="sb-pa-sub-label"><i class="ph-bold ph-chart-bar"></i> Ratings received
                                <span class="sb-pa-anon-badge"><i class="ph-bold ph-lock-simple"></i> Anonymous</span>
                            </div>
                            ${receivedInner}
                        </div>
                    </div>
                </div>`;
            }).join('');

            bodyHtml = `<div class="sb-pa-wrap">
                <div class="sb-pa-members-list">${memberAccordions}</div>
            </div>`;
        }
    }

    if (!bodyHtml.trim()) return '';
    const uid = sectionIdx !== undefined ? `${type}_${sectionIdx}` : type;
    return `<div class="av-section-wrapper" data-section-type="${type}">
        <div class="av-section-header" onclick="sbToggle('${uid}')">
            <div class="av-section-header-left">
                <div class="av-section-icon ${meta.iconClass}">${meta.icon}</div>
                <span class="av-section-label">${section.title || meta.label}</span>
            </div>
            <div class="av-section-header-right">
                <i class="ph-bold ph-caret-down av-toggle-icon open" id="sb-toggle-${uid}"></i>
            </div>
        </div>
        <div class="av-section-body" id="sb-body-${uid}">
            <div class="av-section-body-inner">${bodyHtml}</div>
        </div>
    </div>`;
}

function sbToggle(uid) {

// ============================================================
// RUBRIC GRADING
// ============================================================
let _sbRubricSelections = {};  // { ri: ci }
let _sbRubricCols = [];

function _sbRubricInit(sub) {
    _sbRubricSelections = {};
    if (sub.rubric_scores) {
        Object.entries(sub.rubric_scores).forEach(([ri, ci]) => { _sbRubricSelections[parseInt(ri)] = parseInt(ci); });
    }
    const rd = parsedActivity?.sections?.find(s => s.type === 'rubric')?.rubric;
    _sbRubricCols = rd?.columns || [];
}

function sbRubricSelect(ri, ci) {
    _sbRubricSelections[ri] = ci;
    // Update cell highlights
    const table = document.getElementById('sbRubricTable');
    if (!table) return;
    table.querySelectorAll(`.sb-rubric-cell[data-ri="${ri}"]`).forEach(td => {
        td.classList.toggle('sb-rubric-selected', parseInt(td.dataset.ci) === ci);
    });
    _sbRubricUpdateScore();
}

function _sbRubricUpdateScore() {
    const rd = parsedActivity?.sections?.find(s => s.type === 'rubric')?.rubric;
    if (!rd) return;
    const cols = rd.columns, crit = rd.criteria;
    const maxTotal = Math.max(...cols.map(c => Number(c.points) || 0)) * crit.length;
    let total = 0;
    crit.forEach((_, ri) => {
        const ci = _sbRubricSelections[ri];
        if (ci !== undefined) total += Number(cols[ci]?.points || 0);
    });
    const pct = maxTotal > 0 ? Math.round((total / maxTotal) * 100) : 0;
    const scoreEl = document.getElementById('sbRubricScore');
    const pctEl   = document.getElementById('sbRubricPct');
    if (scoreEl) scoreEl.textContent = total;
    if (pctEl)   pctEl.textContent   = `= ${pct}/100`;
}

function sbRubricApplyGrade() {
    const rd = parsedActivity?.sections?.find(s => s.type === 'rubric')?.rubric;
    if (!rd) return;
    const cols = rd.columns, crit = rd.criteria;
    const maxTotal = Math.max(...cols.map(c => Number(c.points) || 0)) * crit.length;
    let total = 0;
    crit.forEach((_, ri) => {
        const ci = _sbRubricSelections[ri];
        if (ci !== undefined) total += Number(cols[ci]?.points || 0);
    });
    const pct = maxTotal > 0 ? Math.round((total / maxTotal) * 100) : 0;
    const gradeInput  = document.getElementById('gradeInput');
    const gradeSlider = document.getElementById('gradeSlider');
    if (gradeInput)  { gradeInput.value  = pct; gradeInput.dispatchEvent(new Event('input')); }
    if (gradeSlider) { gradeSlider.value = pct; gradeSlider.dispatchEvent(new Event('input')); }
}

async function sbRubricSave(subId) {
    const btn = document.getElementById('sbRubricSaveBtn');
    if (btn) { btn.disabled = true; btn.innerHTML = '<i class="ph-bold ph-circle-notch" style="animation:spin 0.8s linear infinite"></i> Saving...'; }
    try {
        const res = await fetch(`/api/submissions/${subId}/rubric`, {
            method: 'POST',
            headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
            body: JSON.stringify({ rubric_scores: _sbRubricSelections })
        });
        const data = await res.json();
        if (!res.ok) { showToast(data.message || 'Save failed!', 'error'); return; }
        const sub = allSubmissions.find(s => s.id === subId);
        if (sub) sub.rubric_scores = data.rubric_scores;
        if (currentSubmission?.id === subId) currentSubmission.rubric_scores = data.rubric_scores;
        showToast('Rubric scores saved!', 'success');
    } catch { showToast('Cannot connect to server!', 'error'); }
    finally { if (btn) { btn.disabled = false; btn.innerHTML = '<i class="ph-bold ph-floppy-disk"></i> Save Rubric Scores'; } }
}

// ============================================================
// AI + PLAGIARISM ANALYSIS
// ============================================================
function _plagLabel(p) {
    if (!p) return null;
    const pct = Math.round(p.similarity * 100);
    if (pct >= 85) return { cls: 'sb-badge-red',    icon: 'ph-copy',         text: `${pct}% match — ${p.matched_student}` };
    if (pct >= 60) return { cls: 'sb-badge-yellow', icon: 'ph-warning',      text: `${pct}% similar — ${p.matched_student}` };
    return               { cls: 'sb-badge-green',  icon: 'ph-check-circle', text: `${pct}% similar — clean` };
}

function _buildPlagResults(analysis) {
    const questions = parsedActivity?.sections?.find(s => s.type === 'guide_questions');
    const qItems    = (questions?.content || []).filter(q => q.question || q.text);
    return `<div class="sb-analyze-results">` + Object.keys(analysis).map(k => {
        const r      = analysis[k];
        const qIdx   = parseInt(k);
        const qText  = qItems[qIdx] ? (qItems[qIdx].question || qItems[qIdx].text || `Question ${qIdx + 1}`) : `Question ${qIdx + 1}`;
        const plgLbl = _plagLabel(r.plagiarism);
        const plgBadge = plgLbl
            ? `<span class="sb-badge ${plgLbl.cls}"><i class="ph-bold ${plgLbl.icon}"></i> ${plgLbl.text}</span>`
            : `<span class="sb-badge sb-badge-green"><i class="ph-bold ph-check-circle"></i> Clean</span>`;
        return `<div class="sb-analyze-row">
            <div class="sb-analyze-q">Q${qIdx + 1}. ${sbApplyKatex(qText).replace(/<[^>]*>/g,'').slice(0,80)}${qText.length > 80 ? '…' : ''}</div>
            <div class="sb-analyze-badges">${plgBadge}</div>
        </div>`;
    }).join('') + `</div>`;
}

function buildAnalyzeSection(sub) {
    const analyzedAt = sub.analyzed_at ? `Last checked: ${sub.analyzed_at}` : null;
    const analysis   = sub.analysis || null;
    return `<div class="sb-analyze-form">
        <div class="sb-analyze-title"><i class="ph-bold ph-copy"></i> Plagiarism Check</div>
        ${analyzedAt ? `<div class="sb-analyze-meta"><i class="ph-bold ph-clock"></i> ${analyzedAt}</div>` : '<div class="sb-analyze-meta">Not yet checked.</div>'}
        <button class="sb-analyze-btn" id="analyzeBtnModal" onclick="analyzeSubmission(${sub.id})">
            <i class="ph-bold ph-magnifying-glass"></i> ${analysis ? 'Re-check' : 'Check Plagiarism'}
        </button>
        <div id="analyzeResultsContainer">${analysis ? _buildPlagResults(analysis) : ''}</div>
    </div>`;
}

async function analyzeSubmission(subId) {
    const btn = document.getElementById('analyzeBtnModal');
    if (btn) { btn.disabled = true; btn.innerHTML = '<i class="ph-bold ph-circle-notch" style="animation:spin 0.8s linear infinite"></i> Checking...'; }

    try {
        const res  = await fetch(`/api/submissions/${subId}/analyze`, {
            method: 'POST',
            headers: { 'Authorization': `Bearer ${token}` }
        });
        const data = await res.json();

        if (!res.ok) { showToast(data.message || 'Check failed!', 'error'); return; }

        // Update local cache
        const sub = allSubmissions.find(s => s.id === subId);
        if (sub) { sub.analysis = data.analysis; sub.analyzed_at = data.analyzed_at; }
        if (currentSubmission?.id === subId) {
            currentSubmission.analysis    = data.analysis;
            currentSubmission.analyzed_at = data.analyzed_at;
        }

        document.getElementById('analyzeResultsContainer').innerHTML = _buildPlagResults(data.analysis);
        const metaEl = document.querySelector('.sb-analyze-meta');
        if (metaEl) metaEl.innerHTML = `<i class="ph-bold ph-clock"></i> Last checked: ${data.analyzed_at}`;
        if (btn) btn.innerHTML = '<i class="ph-bold ph-magnifying-glass"></i> Re-check';
        showToast(data.message, 'success');

    } catch { showToast('Cannot connect to server!', 'error'); }
    finally { if (btn) btn.disabled = false; }
}

function buildFullSubmissionView(sub) {
    if (!parsedActivity?.sections) return buildSubmissionDetail(sub);
    const sections = parsedActivity.sections;
    let html = '';
    const hasSectionsConfig = Array.isArray(parsedActivity.sections_config) && parsedActivity.sections_config.length > 0;
    if (hasSectionsConfig) {
        // Respect professor's custom order; support Phase 4 duplicate sections
        sections.forEach((section, idx) => {
            if (section.type === 'student_info') return;
            html += sbBuildSection(section, sub, idx);
        });
    } else {
        // Legacy / DOCX: use hardcoded default order
        for (const type of SB_SECTION_ORDER) {
            if (type === 'student_info') continue;
            const section = sections.find(s => s.type === type);
            if (section) html += sbBuildSection(section, sub, SB_SECTION_ORDER.indexOf(type));
        }
    }
    // Student info is always rendered from submission data, not activity sections
    if (sub.student_info && Object.keys(sub.student_info).length > 0) {
        html += sbBuildSection({ type: 'student_info', content: [] }, sub);
    }
    // Upload Files section
    const sbFiles2 = sub.uploaded_files?.length ? sub.uploaded_files
                   : sub.uploaded_file ? [{ file: sub.uploaded_file, name: 'Uploaded File' }] : [];
    if (sbFiles2.length) {
        const fileCards = sbFiles2.map((f, i) => {
            const safeName = f.file || f;
            const dispName = f.name || `File ${i + 1}`;
            const isPdf    = safeName.endsWith('.pdf');
            const url      = `/api/submissions/file/${safeName}`;
            const icon     = isPdf ? 'ph-file-pdf' : 'ph-image';
            const color    = isPdf ? '#ef4444' : '#0a66c2';
            return `<div onclick="_sbOpenFileModal('${url}',${isPdf},'${dispName.replace(/'/g,"\\'")}')"
                style="display:flex;align-items:center;gap:10px;padding:10px 12px;
                border:1.5px solid var(--border);border-radius:10px;background:var(--surface);
                cursor:pointer;transition:border-color 0.15s;margin-bottom:8px;"
                onmouseover="this.style.borderColor='var(--primary)'"
                onmouseout="this.style.borderColor='var(--border)'">
                <i class="ph-bold ${icon}" style="font-size:20px;color:${color};flex-shrink:0;"></i>
                <span style="font-size:13px;font-weight:600;color:var(--text-1);flex:1;word-break:break-all;font-family:'DM Sans',sans-serif;">${dispName}</span>
                <i class="ph-bold ph-caret-right" style="color:var(--text-3);font-size:16px;flex-shrink:0;"></i>
            </div>`;
        }).join('');
        html += `<div class="av-section-wrapper" data-section-type="upload_files">
            <div class="av-section-header" onclick="sbToggle('upload_files')">
                <div class="av-section-header-left">
                    <div class="av-section-icon av-icon-teal"><i class="ph-bold ph-paperclip"></i></div>
                    <span class="av-section-label">Uploaded Files (${sbFiles2.length})</span>
                </div>
                <div class="av-section-header-right">
                    <i class="ph-bold ph-caret-down av-toggle-icon open" id="sb-toggle-upload_files"></i>
                </div>
            </div>
            <div class="av-section-body" id="sb-body-upload_files">
                <div class="av-section-body-inner">${fileCards}</div>
            </div>
        </div>`;
    }
    // Analyze section (professor only)
    html += buildAnalyzeSection(sub);

    // Grade form
    const currentGrade = sub.grade ?? '';
    const isGroup = !!sub.group_id;
    const gradeLabel = isGroup ? 'Save Grade for All Members' : 'Save Grade';
    const gradeNote  = isGroup ? `<div style="font-size:11px;color:var(--text-3);margin-top:4px;"><i class="ph-bold ph-users"></i> This grade will apply to all members of this group.</div>` : '';
    html += `<div class="sb-grade-form" style="margin-top:8px;">
        <div class="sb-grade-form-title"><i class="ph-bold ph-star"></i> Grade This Submission${gradeNote}</div>
        <div class="sb-grade-row">
            <span class="sb-grade-row-label">Score:</span>
            <input type="number" class="sb-grade-input" id="gradeInput" min="0" max="100" value="${currentGrade}" placeholder="0">
            <span class="sb-grade-denom-label">/100</span>
            <input type="range" class="sb-grade-slider" id="gradeSlider" min="0" max="100" value="${currentGrade||0}">
        </div>
        <div class="sb-quick-wrap">
            <span class="sb-quick-label">Quick:</span>
            <div class="sb-quick-grades">
                ${[60,65,70,75,80,85,90,95,100].map(g=>`<button class="sb-quick-btn" onclick="setGrade(${g})">${g}</button>`).join('')}
            </div>
        </div>
        <label class="sb-feedback-label">Feedback (optional):</label>
        <textarea class="sb-feedback-input" id="feedbackInput" placeholder="Write your feedback here...">${sub.feedback||''}</textarea>
        <div class="sb-grade-actions">
            <button class="sb-btn-save-grade" onclick="submitGrade(${sub.id})">

                <i class="ph-bold ph-check-circle"></i> Grade Saved!

            ${members.map((name, i) => `
                <div class="sb-info-item">

            ${info.group_name ? `<div class="sb-info-item">
                <div class="sb-info-label">Group</div>
                <div class="sb-info-value">${info.group_name}</div>
            </div>` : ''}
            <div class="sb-info-item">
                <div class="sb-info-label">Section</div>
                <div class="sb-info-value">${info.section || '—'}</div>
            </div>
            <div class="sb-info-item">
                <div class="sb-info-label">Date</div>
                <div class="sb-info-value">${info.date || '—'}</div>
            </div>
        </div>
    </div>`;

    const materials = parsedActivity?.sections?.find(s => s.type === 'materials');
    const checked = sub.materials_checked || {};
    if (materials && materials.content.some(c => c.item || c.is_checkbox)) {
        html += `<div class="sb-detail-section">
            <div class="sb-detail-title"><i class="ph-bold ph-test-tube"></i> Materials Checklist</div>
            <div class="sb-materials-list">
            ${materials.content.map((c, i) => {
                if (!(c.item || c.is_checkbox)) return '';
                const isChecked = checked[i];
                return `<div class="sb-material-item ${isChecked ? 'sb-checked' : ''}">
                    <i class="ph-bold ${isChecked ? 'ph-check-square' : 'ph-square'}"
                       style="color:${isChecked ? '#10b981' : '#d1d5db'};font-size:17px;"></i>
                    <span>${c.item || ''}</span>
                </div>`;
            }).join('')}
            </div>
        </div>`;
    }

    const tableData = sub.table_data || {};
    const tables = parsedActivity?.tables || [];
    if (tables.length > 0) {
        html += `<div class="sb-detail-section">
            <div class="sb-detail-title"><i class="ph-bold ph-table"></i> Data Sheet</div>`;
        tables.forEach((table, tableIndex) => {
            // Handle both formats: plain array[][] or {title, rows, notes}
            const tableRows  = Array.isArray(table) ? table : (table.rows || []);
            const tableTitle = Array.isArray(table) ? '' : (table.title || '');
            const tableNotes = Array.isArray(table) ? '' : (table.notes || '');
            if (tableTitle) html += `<div style="font-weight:700;font-size:13px;color:var(--text-2);margin-bottom:6px;">${tableTitle}</div>`;
            html += `<div class="sb-table-wrap"><table class="sb-table">`;

                                   : (typeof cell === 'object' ? '' : (cell || ''));
                    if (rIndex === 0) {
                        html += `<th>${cellText || `Column ${cIndex + 1}`}</th>`;
                    } else {
                        // Support new format: tableData[tableIndex][rIndex][cIndex]
                        // and old format: tableData[rIndex][cIndex]
                        const tKey = String(tableIndex);
                        const rKey = String(rIndex);
                        const cKey = String(cIndex);
                        const saved = tableData?.[tKey]?.[rKey]?.[cKey]
                                   ?? tableData?.[rKey]?.[cKey]
                                   ?? '';
                        html += `<td>${saved || cellText || '—'}</td>`;

                const qText = q.question || q.text || '';
                if (!qText) return '';
                const answer = answers[String(i)] ?? answers[i] ?? '';
                return `<div class="sb-answer-item">
                    <div class="sb-answer-q">${qNum}. ${qText}</div>
                    ${answer
                        ? `<div class="sb-answer-text">${answer}</div>`
                        : `<div class="sb-answer-empty">No answer provided.</div>`}
                </div>`;
            }).join('')}
        </div>`;
    }

    const sbFiles = sub.uploaded_files?.length ? sub.uploaded_files
                  : sub.uploaded_file ? [{ file: sub.uploaded_file, name: 'Uploaded File' }] : [];
    if (sbFiles.length) {
        const sbFileCards = sbFiles.map((f, i) => {
            const safeName = f.file || f;
            const dispName = f.name || `File ${i + 1}`;
            const isPdf    = safeName.endsWith('.pdf');
            const url      = `/api/submissions/file/${safeName}`;
            const icon     = isPdf ? 'ph-file-pdf' : 'ph-image';
            const color    = isPdf ? '#ef4444' : '#0a66c2';
            return `<div onclick="_sbOpenFileModal('${url}',${isPdf},'${dispName.replace(/'/g,"\\'")}')"
                style="display:flex;align-items:center;gap:10px;padding:10px 12px;
                border:1.5px solid var(--border);border-radius:10px;background:var(--surface);
                cursor:pointer;transition:border-color 0.15s;margin-bottom:8px;"
                onmouseover="this.style.borderColor='var(--primary)'"
                onmouseout="this.style.borderColor='var(--border)'">
                <i class="ph-bold ${icon}" style="font-size:20px;color:${color};flex-shrink:0;"></i>
                <span style="font-size:13px;font-weight:600;color:var(--text-1);flex:1;word-break:break-all;font-family:'DM Sans',sans-serif;">${dispName}</span>
                <i class="ph-bold ph-caret-right" style="color:var(--text-3);font-size:16px;flex-shrink:0;"></i>
            </div>`;
        }).join('');
        html += `<div class="sb-detail-section">
            <div class="sb-detail-title"><i class="ph-bold ph-paperclip"></i> Uploaded Files (${sbFiles.length})</div>
            ${sbFileCards}
        </div>`;
    }

    const currentGrade = sub.grade ?? '';
    const isGroup2 = !!sub.group_id;
    const gradeLabel2 = isGroup2 ? 'Save Grade for All Members' : 'Save Grade';
    const gradeNote2  = isGroup2 ? `<div style="font-size:11px;color:var(--text-3);margin-top:4px;"><i class="ph-bold ph-users"></i> This grade will apply to all members of this group.</div>` : '';
    html += `<div class="sb-grade-form">
        <div class="sb-grade-form-title"><i class="ph-bold ph-star"></i> Grade This Submission${gradeNote2}</div>
        <div class="sb-grade-row">
            <span class="sb-grade-row-label">Score:</span>
            <input type="number" class="sb-grade-input" id="gradeInput"
                   min="0" max="100" value="${currentGrade}" placeholder="0">
            <span class="sb-grade-denom-label">/100</span>
            <input type="range" class="sb-grade-slider" id="gradeSlider"
                   min="0" max="100" value="${currentGrade || 0}">
        </div>
        <div class="sb-quick-wrap">
            <span class="sb-quick-label">Quick:</span>
            <div class="sb-quick-grades">
                ${[60,65,70,75,80,85,90,95,100].map(g =>
                    `<button class="sb-quick-btn" onclick="setGrade(${g})">${g}</button>`
                ).join('')}
            </div>
        </div>
        <label class="sb-feedback-label">Feedback (optional):</label>
        <textarea class="sb-feedback-input" id="feedbackInput"
            placeholder="Write your feedback here...">${sub.feedback || ''}</textarea>
        <div class="sb-grade-actions">
            <button class="sb-btn-save-grade" onclick="submitGrade(${sub.id})">
                <i class="ph-bold ph-floppy-disk"></i> ${gradeLabel2}
            </button>
            <span class="sb-grade-saved-msg" id="gradeSavedMsg">
                <i class="ph-bold ph-check-circle"></i> Grade Saved!
            </span>
        </div>
    </div>`;
    return html;
}

function setGrade(val) {
    const input  = document.getElementById('gradeInput');
    const slider = document.getElementById('gradeSlider');
    if (input)  input.value  = val;
    if (slider) slider.value = val;
}

async function submitGrade(submissionId) {
    const grade    = parseFloat(document.getElementById('gradeInput').value);
    const feedback = document.getElementById('feedbackInput').value;
    if (isNaN(grade) || grade < 0 || grade > 100) {
        showToast('Please enter a valid grade (0-100)!', 'warning'); return;
    }
    try {
        const response = await fetch(`/api/submissions/${submissionId}/grade`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
            body: JSON.stringify({ grade, feedback })
        });
        await safeJson(response); // consume body safely
        if (response.ok) {
            const sub = allSubmissions.find(s => s.id === submissionId);
            if (sub) { sub.grade = grade; sub.feedback = feedback; sub.status = 'graded'; }
            updateStats();
            renderSubmissions();
            renderGroupSubmissions();
            const msg = document.getElementById('gradeSavedMsg');
            if (msg) { msg.style.display = 'inline-flex'; setTimeout(() => msg.style.display = 'none', 2500); }
            showToast('Grade saved successfully!', 'success');
        } else {
            showToast('Cannot save grade!', 'error');
        }
    } catch { showToast('Cannot connect to server!', 'error'); }
}

loadData();


// ── SUBMISSIONS POLLING (professor) ──────────────────────────
// Polls every 4 seconds; re-renders if any submission count or status changed.
(function startSubmissionsPoll() {
    const activityId = new URLSearchParams(window.location.search).get('id');
    if (!activityId) return;
    let knownCount = null;

    setInterval(async () => {
        try {
            const res = await fetch(`/api/submissions/${activityId}/all`,
                { headers: { 'Authorization': `Bearer ${token}` } });
            if (!res.ok) return;
            const fresh = await res.json();
            if (!Array.isArray(fresh)) return;

            if (knownCount === null) { knownCount = fresh.length; return; }

            if (fresh.length > knownCount) {
                knownCount = fresh.length;
                const btn = document.getElementById('newSubBtn');
                if (btn) btn.style.display = 'inline-flex';
            }
        } catch { /* ignore */ }
    }, 5000);
})();
</script>

<div id="sbFilePreviewModal" style="
    position:fixed;inset:0;z-index:9999;
    background:rgba(0,0,0,0.82);backdrop-filter:blur(4px);
    display:flex;flex-direction:column;align-items:stretch;
    opacity:0;pointer-events:none;transition:opacity 0.2s;" onclick="_sbCloseFileModal(event)">
    <div style="display:flex;align-items:center;gap:10px;padding:12px 16px;background:rgba(20,20,30,0.95);flex-shrink:0;">
        <i id="sbFileModalIcon" class="ph-bold ph-file" style="font-size:20px;flex-shrink:0;color:#fff;"></i>
        <span id="sbFileModalName" style="flex:1;font-size:14px;font-weight:600;color:#fff;font-family:'DM Sans',sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;"></span>
        <a id="sbFileModalOpen" href="#" target="_blank" style="display:flex;align-items:center;gap:5px;padding:6px 12px;background:#0a66c2;color:#fff;border:none;border-radius:8px;font-size:12px;font-weight:600;font-family:'DM Sans',sans-serif;cursor:pointer;text-decoration:none;">
            <i class="ph-bold ph-arrow-square-out"></i> Open</a>
        <button onclick="_sbCloseFileModal()" style="background:none;border:none;color:#fff;font-size:22px;cursor:pointer;padding:4px 8px;border-radius:6px;line-height:1;">
            <i class="ph-bold ph-x"></i></button>
    </div>
    <div id="sbFileModalBody" style="flex:1;overflow:auto;display:flex;align-items:flex-start;justify-content:center;"></div>
</div>
<script>
async function _sbOpenFileModal(url, isPdf, name) {
    const modal = document.getElementById('sbFilePreviewModal');
    const body  = document.getElementById('sbFileModalBody');
    document.getElementById('sbFileModalName').textContent = name || (isPdf ? 'Document' : 'Image');
    const icon = document.getElementById('sbFileModalIcon');
    icon.className = `ph-bold ${isPdf ? 'ph-file-pdf' : 'ph-image'}`;
    icon.style.cssText = `font-size:20px;flex-shrink:0;color:${isPdf ? '#f87171' : '#60a5fa'};`;
    body.innerHTML = '<div style="display:flex;justify-content:center;align-items:center;height:200px;"><span style="color:var(--text-3);font-family:\'DM Sans\',sans-serif;font-size:14px;">Loading...</span></div>';
    modal.style.opacity = '1';
    modal.style.pointerEvents = 'all';
    document.body.style.overflow = 'hidden';
    try {
        const tok = localStorage.getItem('token') || '';
        const resp = await fetch(url, { headers: { 'Authorization': 'Bearer ' + tok } });
        if (!resp.ok) throw new Error('Failed to load file');
        const blob = await resp.blob();
        const blobUrl = URL.createObjectURL(blob);
        const openBtn = document.getElementById('sbFileModalOpen');
        openBtn.href = blobUrl;
        openBtn.download = name || 'file';
        body.innerHTML = '';
        if (isPdf) {
            const fr = document.createElement('iframe');
            fr.src = blobUrl;
            fr.style.cssText = 'width:100%;height:100%;border:none;min-height:100vh;';
            body.appendChild(fr);
        } else {
            const img = document.createElement('img');
            img.src = blobUrl; img.alt = name;
            img.style.cssText = 'max-width:100%;max-height:100vh;object-fit:contain;display:block;margin:auto;';
            body.appendChild(img);
        }
    } catch (e) {
        body.innerHTML = '<div style="display:flex;justify-content:center;align-items:center;height:200px;"><span style="color:#f87171;font-family:\'DM Sans\',sans-serif;font-size:14px;">Failed to load file.</span></div>';
    }
}
function _sbCloseFileModal(e) {
    if (e && e.target !== document.getElementById('sbFilePreviewModal')) return;
    const modal = document.getElementById('sbFilePreviewModal');
    modal.style.opacity = '0';
    modal.style.pointerEvents = 'none';
    document.getElementById('sbFileModalBody').innerHTML = '';
    document.body.style.overflow = '';
}
</script>
<script>if("serviceWorker"in navigator)navigator.serviceWorker.register("/sw.js",{scope:"/"}).catch(()=>{});</script>
