<html lang="en">
<head>

    <meta charset="UTF-8">
    <link rel="icon" href="/static/favicons/submissions.svg" type="image/svg+xml">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="PHYSLAB">
    <link rel="apple-touch-icon" href="/static/logo.svg">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#4f46e5">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submissions — PHYSLAB</title>
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;800;900&family=Sora:wght@400;600;700;800&family=DM+Sans:wght@400;500;600&family=Merriweather:wght@400;700&family=Abril+Fatface&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">

    <script src="https://unpkg.com/@phosphor-icons/web" defer></script>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <link rel="stylesheet" href="static/style.css">
    <style>

/* ===== THEME VARIABLES ===== */
:root { --primary:#0A66C2; --primary-l:#5b9bd5; --primary-dark:#004182; --primary-dark-l:#a78bfa; }
[data-theme="dark"] {
    --bg:#1B1F23; --bg-2:#16191D; --surface:#22272B;
    --border:rgba(255,255,255,0.08); --border-h:rgba(10,102,194,0.15);
    --text:#ffffff; --text-2:rgba(255,255,255,0.65); --text-3:rgba(255,255,255,0.35);
    --input-bg:rgba(255,255,255,0.05); --input-bg-f:rgba(255,255,255,0.08);
    --placeholder:rgba(255,255,255,0.25); --card-bg:rgba(255,255,255,0.03);
}
[data-theme="light"] {
    --bg:#F3F2EF; --bg-2:#E8E7E3; --surface:#ffffff;
    --border:rgba(10,102,194,0.12); --border-h:rgba(10,102,194,0.45);
    --text:#1B1F23; --text-2:#555555; --text-3:#888888;
    --input-bg:#F9F9F9; --input-bg-f:#F0F0F0; --placeholder:#AAAAAA; --card-bg:rgba(10,102,194,0.02);
}

/* ===== BG EFFECTS ===== */
body::before { content:''; position:fixed; top:-200px; left:-200px; width:600px; height:600px;
    background:transparent; pointer-events:none; z-index:0; }
body::after  { content:''; position:fixed; bottom:-200px; right:-200px; width:500px; height:500px;
    background:transparent; pointer-events:none; z-index:0; }
.bg-grid { position:fixed; inset:0; z-index:0; pointer-events:none;
    
    background-image: linear-gradient(var(--border) 1px, transparent 1px), linear-gradient(90deg, var(--border) 1px, transparent 1px);
    background-size:60px 60px; }
.particles { position:fixed; inset:0; pointer-events:none; z-index:0; overflow:hidden; }
.particle { position:absolute; width:2px; height:2px; border-radius:50%;
    background:rgba(129,140,248,0.7); animation:floatParticle linear infinite; }
@keyframes floatParticle {
    0%   { transform:translateY(100vh) translateX(0) scale(0); opacity:0; }
    10%  { opacity:1; }
    90%  { opacity:0.5; }
    100% { transform:translateY(-100px) translateX(var(--drift)) scale(1.5); opacity:0; }
}

/* ===== NAVBAR ===== */
.navbar {
    background: rgba(15,14,26,0.45) !important;
    backdrop-filter: blur(40px) saturate(180%) !important;
    border: 1px solid rgba(255,255,255,0.09) !important;
    box-shadow: 0 8px 32px rgba(0,0,0,0.35), 0 2px 8px rgba(0,0,0,0.2), inset 0 1px 0 rgba(255,255,255,0.07) !important;
}
[data-theme="light"] .navbar {
    background: rgba(255,255,255,0.75) !important;
    border-color: rgba(10,102,194,0.15) !important;
    box-shadow: 0 8px 32px rgba(10,102,194,0.1), 0 2px 8px rgba(0,0,0,0.06), inset 0 1px 0 rgba(255,255,255,0.9) !important;
}

.nav-brand {
    font-family:'Abril Fatface','Sora',sans-serif !important;
    font-size:15px !important; font-weight:800 !important; letter-spacing:1px !important;
    color:var(--text) !important; display:flex; align-items:center; gap:10px; text-decoration:none;
}
/* Update mo itong CSS para sa logo container */
.brand-icon {
    width: 32px; /* O 40px depende sa page */
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 12px;
    overflow: hidden;
}

/* Idagdag mo itong rule para sa mismong image */
.brand-icon img {
    width: 100%;
    height: 100%;
    object-fit: contain;
}

.nav-hello { font-size:13px; color:var(--text-2); }
.nav-hello strong { color:var(--text); }
.badge-prof {
    background:rgba(245,158,11,0.15);
    color:#f59e0b; border:1px solid rgba(245,158,11,0.3);
    padding:4px 10px; border-radius:20px; font-size:11px; font-weight:700;
}
.nav-avatar {
    width:34px; height:34px; border-radius:10px;
    background:#0A66C2;
    border:2px solid var(--border); display:flex; align-items:center; justify-content:center;
    overflow:hidden; cursor:pointer; text-decoration:none; transition:border-color 0.2s; flex-shrink:0;
}
.nav-avatar:hover { border-color:var(--border-h); transform:none; box-shadow:none; }
.nav-av-initial { font-family:'Sora',sans-serif; font-size:13px; font-weight:800; color:white; pointer-events:none; }
.nav-avatar img { width:100%; height:100%; object-fit:cover; display:none; border-radius:8px; }
.btn-logout {
    display:flex; align-items:center; gap:6px;
    background:transparent !important; border:1px solid var(--border) !important;
    color:var(--text-2) !important; padding:7px 14px !important; border-radius:9px !important;
    font-size:13px !important; font-weight:600 !important; cursor:pointer; transition:all 0.2s;
}
.btn-logout:hover { border-color:rgba(239,68,68,0.4) !important; color:#fca5a5 !important; background:rgba(239,68,68,0.07) !important; }
        @media (max-width: 768px) {
            .navbar { padding: 0 14px; max-width: calc(100vw - 24px); }
            .nav-brand { font-size: 16px; }
            .nav-hello { display: none; }
            .badge-prof, .badge-student { display: none; }
            .btn-logout { padding: 6px 10px; font-size: 12px; }
        }
        @media (max-width: 480px) {
            .navbar { padding: 0 12px; max-width: calc(100vw - 16px); }
            .nav-brand { font-size: 14px; }
        }
[data-theme="light"] .btn-logout { color:#555555 !important; }
[data-theme="light"] .btn-logout:hover { color:#dc2626 !important; }
.nav-avatar-wrap { position: relative; }
.nav-avatar { cursor: pointer; padding: 0; }
.nav-dropdown {
    display: none; position: absolute; right: 0; top: calc(100% + 10px);
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; min-width: 185px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.25);
    overflow: hidden; z-index: 300;
}
.nav-dropdown.open { display: block; }
.nav-dropdown a, .nav-dropdown button {
    display: flex; align-items: center; gap: 10px;
    width: 100%; padding: 10px 16px; text-align: left;
    font-size: 13px; font-weight: 500; color: var(--text);
    background: none; border: none; text-decoration: none;
    cursor: pointer; transition: background 0.15s;
    font-family: 'Inter', sans-serif; box-sizing: border-box;
}
.nav-dropdown a:hover, .nav-dropdown button:hover { background: rgba(255,255,255,0.06); }
[data-theme="light"] .nav-dropdown a:hover,
[data-theme="light"] .nav-dropdown button:hover { background: rgba(0,0,0,0.05); }
.nd-divider { height: 1px; background: var(--border); margin: 4px 0; }
.nd-logout { color: #fca5a5 !important; }
.nd-logout:hover { background: rgba(239,68,68,0.08) !important; }

/* ===== DASHBOARD LAYOUT ===== */
body.dashboard-body { background:var(--bg) !important; color:var(--text); font-family:'DM Sans',sans-serif; }
.dashboard-container { position:relative; z-index:1; }
.btn-back {
    background:var(--input-bg) !important; border:1px solid var(--border) !important;
    color:var(--text-2) !important; border-radius:9px !important; font-size:13px !important;
    font-weight:600 !important; padding:8px 16px !important; margin-bottom:20px;
    display:inline-flex; align-items:center; gap:6px; cursor:pointer; transition:all 0.2s;
}
.btn-back:hover { border-color:var(--border-h) !important; color:var(--text) !important; }
.section-card {
    background:var(--surface) !important; border:1px solid var(--border) !important;
    border-radius:16px !important; box-shadow:none !important;
}

/* ===== PAGE HEADER ===== */
.sb-header {
    display:flex; align-items:center; justify-content:space-between;
    gap:16px; margin-bottom:24px; flex-wrap:wrap;
}
.sb-header-left { display:flex; align-items:center; gap:16px; }
.sb-header-icon {
    width:52px; height:52px; border-radius:14px; flex-shrink:0;
    background:#0A66C2;
    display:flex; align-items:center; justify-content:center;
    font-size:24px; color:white;
}
.sb-header-title {
    font-family: 'Plus Jakarta Sans', 'Inter', sans-serif; font-size:22px; font-weight:900;
    color:#ffffff; letter-spacing:-0.3px; margin:0 0 4px;
    font-style: italic; /* italic */
}
.sb-header-sub { font-size:13px; color:rgba(255,255,255,0.7); margin:0; }
[data-theme="light"] .sb-header-title { color: #ffffff; }
[data-theme="light"] .sb-header-sub   { color: rgba(255,255,255,0.75); }
[data-theme="dark"]  .sb-header-title { color: #ffffff; }
[data-theme="dark"]  .sb-header-sub   { color: rgba(255,255,255,0.65); }

/* ===== STATS ROW ===== */
.sb-stats-row {
    display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
    gap:14px; margin-bottom:24px;
}
.sb-stat-card {
    background:var(--surface); border:1px solid var(--border); border-radius:14px;
    padding:16px 18px; display:flex; align-items:center; gap:14px;
    transition:border-color 0.2s, transform 0.2s;
}
.sb-stat-card:hover { border-color:var(--border-h); }
.sb-stat-icon {
    width:42px; height:42px; border-radius:11px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center; font-size:19px;
}
.sb-stat-icon-blue   { background:rgba(59,130,246,0.12);  color:#60a5fa; }
.sb-stat-icon-green  { background:rgba(16,185,129,0.12);  color:#34d399; }
.sb-stat-icon-purple { background:rgba(139,92,246,0.12);  color:#a78bfa; }
.sb-stat-icon-amber  { background:rgba(245,158,11,0.12);  color:#fbbf24; }
.sb-stat-num { font-family:'Sora',sans-serif; font-size:24px; font-weight:800; color:var(--text); line-height:1; margin-bottom:3px; }
.sb-stat-num-green  { color:#34d399; }
.sb-stat-num-purple { color:#a78bfa; }
.sb-stat-num-amber  { color:#fbbf24; }
.sb-stat-label { font-size:12px; color:var(--text-3); font-weight:500; }

/* ===== VIEW TOGGLE ===== */
.sb-view-toggle {
    display:flex; gap:4px; background:var(--input-bg);
    border:1px solid var(--border); border-radius:12px; padding:4px;
    margin-bottom:20px; width:fit-content;
}
.sb-view-btn {
    padding:8px 18px; border:none; border-radius:9px; background:transparent;
    font-family:'DM Sans',sans-serif; font-size:13px; font-weight:600;
    color:var(--text-3); cursor:pointer; transition:all 0.2s;
    display:flex; align-items:center; gap:6px;
}
.sb-view-btn:hover { color:var(--text-2); }
.sb-view-btn.active {
    background:var(--surface); color:var(--primary-l);
    box-shadow:0 2px 8px rgba(0,0,0,0.12);
}
[data-theme="light"] .sb-view-btn.active { color:var(--primary); }

/* ===== SECTION TITLE ===== */
.db-section-title {
    font-family:'Sora',sans-serif !important; font-size:15px !important; font-weight:700 !important;
    color:var(--text) !important; margin-bottom:18px !important;
    display:flex; align-items:center; gap:8px;
}

/* ===== GROUP CARDS ===== */
.sb-group-card {
    background:var(--card-bg); border:1.5px solid var(--border);
    border-radius:16px; margin-bottom:12px; overflow:hidden;
    transition:border-color 0.2s, box-shadow 0.2s;
}
.sb-group-card:hover { border-color:var(--border-h); box-shadow:0 4px 18px rgba(10,102,194,0.1); }
.sb-group-header {
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 18px; background:var(--input-bg);
    border-bottom:1.5px solid transparent;
    flex-wrap:wrap; gap:10px; cursor:pointer; user-select:none; transition:background 0.2s;
}
.sb-group-header:hover { background:var(--input-bg-f); }
.sb-group-card.open .sb-group-header { border-bottom-color:var(--border); }
.sb-group-header-left { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.sb-group-num {
    background:#0A66C2;
    color:white; font-size:11px; font-weight:800; padding:3px 11px;
    border-radius:20px; font-family:'Sora',sans-serif; white-space:nowrap;
}
.sb-group-name { font-size:14px; font-weight:700; color:var(--text); }
.sb-group-grade-badge { display:inline-flex; align-items:center; gap:6px; font-size:13px; font-weight:800; }
.sb-group-grade-badge.graded  { color:#34d399; }
.sb-group-grade-badge.pending { color:var(--text-3); }
.sb-group-caret { color:var(--text-3); font-size:15px; transition:transform 0.25s; flex-shrink:0; }
.sb-group-card.open .sb-group-caret { transform:rotate(180deg); }

.sb-group-body { padding:16px 18px; display:none; }
.sb-group-body.open { display:block; animation:fadeBodyIn 0.2s ease; }
@keyframes fadeBodyIn { from { opacity:0; transform:translateY(-6px); } to { opacity:1; transform:none; } }

/* Progress pill */
.sb-progress-pill {
    display:inline-flex; align-items:center; gap:6px;
    background:var(--input-bg); border:1px solid var(--border);
    border-radius:20px; padding:3px 10px; font-size:11px; font-weight:600;
    color:var(--text-2); white-space:nowrap;
}
.sb-progress-track { width:46px; height:4px; background:var(--border); border-radius:2px; overflow:hidden; }
.sb-progress-fill { height:100%; border-radius:2px; background:#0A66C2; transition:width 0.3s; }
.sb-progress-fill.complete { background:#10b981; }

/* Members in group */
.sb-group-members { display:flex; flex-direction:column; gap:8px; margin-bottom:16px; }
.sb-group-member-row {
    display:flex; align-items:center; gap:12px; padding:10px 14px;
    border-radius:11px; background:var(--input-bg); border:1px solid var(--border);
    transition:border-color 0.2s; flex-wrap:wrap;
}
.sb-group-member-row:hover { border-color:var(--border-h); }
.sb-group-member-info { flex:1; min-width:120px; }
.sb-group-member-name { font-size:13px; font-weight:600; color:var(--text); }
.sb-group-member-meta { font-size:11px; color:var(--text-3); margin-top:2px; }
.sb-leader-tag {
    font-size:10px; font-weight:800; color:#34d399;
    background:rgba(52,211,153,0.12); border:1px solid rgba(52,211,153,0.25);
    padding:2px 8px; border-radius:20px; white-space:nowrap;
    display:inline-flex; align-items:center; gap:4px;
}
.sb-member-tag {
    font-size:10px; font-weight:700; color:var(--text-3);
    background:rgba(156,163,175,0.1); border:1px solid rgba(156,163,175,0.25);
    padding:2px 8px; border-radius:20px; white-space:nowrap;
    display:inline-flex; align-items:center; gap:4px;
}
.sb-submitted-tag {
    font-size:10px; font-weight:700; padding:3px 9px; border-radius:20px;
    display:inline-flex; align-items:center; gap:4px; white-space:nowrap;
}
.sb-submitted-tag.yes    { background:rgba(59,130,246,0.1);  color:#60a5fa;  border:1px solid rgba(59,130,246,0.2); }
.sb-submitted-tag.no     { background:var(--input-bg);        color:var(--text-3); border:1px solid var(--border); }
.sb-submitted-tag.graded { background:rgba(52,211,153,0.1);  color:#34d399;  border:1px solid rgba(52,211,153,0.2); }
[data-theme="light"] .sb-submitted-tag.yes    { background:#eff6ff; color:#2563eb; }
[data-theme="light"] .sb-submitted-tag.graded { background:#d1fae5; color:#059669; }

/* Group grade form */
.sb-group-grade-form {
    background:var(--input-bg); border:1.5px solid var(--border-h);
    border-radius:14px; padding:16px 18px; margin-top:4px;
}
.sb-group-grade-title {
    font-size:13px; font-weight:700; color:var(--primary-l);
    display:flex; align-items:center; gap:7px; margin-bottom:12px;
    font-family:'DM Sans',sans-serif;
}
[data-theme="light"] .sb-group-grade-title { color:var(--primary); }
.sb-group-grade-note {
    font-size:11px; color:var(--text-3);
    background:var(--card-bg); border:1px solid var(--border);
    border-radius:8px; padding:7px 11px; margin-bottom:12px;
    display:flex; align-items:center; gap:6px;
}
.sb-group-no-sub {
    font-size:12px; color:var(--text-3); padding:10px 0; text-align:center;
    display:flex; align-items:center; justify-content:center; gap:6px;
}

/* ===== STATUS BADGES ===== */
.sb-status-badge {
    display:inline-flex; align-items:center; gap:5px; padding:4px 10px;
    border-radius:20px; font-size:11px; font-weight:700; white-space:nowrap;
}
.sb-status-graded    { background:rgba(52,211,153,0.12); color:#34d399;  border:1px solid rgba(52,211,153,0.25); }
.sb-status-submitted { background:rgba(59,130,246,0.12); color:#60a5fa;  border:1px solid rgba(59,130,246,0.2); }
.sb-status-pending   { background:var(--input-bg);        color:var(--text-3); border:1px solid var(--border); }
[data-theme="light"] .sb-status-graded    { background:#d1fae5; color:#059669; border-color:#a7f3d0; }
[data-theme="light"] .sb-status-submitted { background:#eff6ff; color:#2563eb; border-color:#bfdbfe; }
[data-theme="light"] .sb-status-pending   { background:#f1f5f9; color:#64748b; border-color:#e2e8f0; }

/* ===== SUBMISSION CARD (individual) ===== */
.sb-submission-card {
    display:flex; align-items:center; gap:14px; padding:14px 16px;
    border-radius:12px; background:var(--card-bg); border:1px solid var(--border);
    margin-bottom:10px; transition:border-color 0.2s, background 0.2s; flex-wrap:wrap;
}
.sb-submission-card:hover { border-color:var(--border-h); background:var(--input-bg); }
.sb-student-name { font-size:14px; font-weight:700; color:var(--text); margin-bottom:4px; }
.sb-submission-info { flex:1; min-width:160px; }
.sb-submission-meta { display:flex; gap:12px; flex-wrap:wrap; }
.sb-submission-meta span { font-size:12px; color:var(--text-3); display:flex; align-items:center; gap:5px; }
.sb-grade-pill {
    background:#0A66C2;
    color:white; padding:5px 14px; border-radius:20px;
    font-family:'Sora',sans-serif; font-size:14px; font-weight:800;
    white-space:nowrap; flex-shrink:0;
}
.sb-grade-denom { font-size:11px; opacity:0.7; }
.sb-grade-empty { background:var(--input-bg); color:var(--text-3); border:1px solid var(--border); }
.sb-btn-view {
    display:inline-flex; align-items:center; gap:7px;
    background:var(--input-bg); border:1.5px solid var(--border-h);
    color:var(--primary-l); padding:8px 16px; border-radius:9px;
    font-size:13px; font-weight:600; cursor:pointer; font-family:'DM Sans',sans-serif;
    transition:all 0.2s; flex-shrink:0; white-space:nowrap;
}
.sb-btn-view:hover { background:var(--primary); color:white; border-color:var(--primary); }
[data-theme="light"] .sb-btn-view { color:var(--primary); }
[data-theme="light"] .sb-btn-view:hover { color:white; }

/* ===== MODAL ===== */
.modal-overlay {
    display:none; position:fixed; inset:0; z-index:1000;
    background:rgba(0,0,0,0.6); backdrop-filter:blur(4px);
    align-items:center; justify-content:center; padding:20px;
}
.modal-overlay.active { display:flex; animation:overlayIn 0.2s ease; }
@keyframes overlayIn { from { opacity:0; } to { opacity:1; } }
.sb-modal-box {
    background:var(--surface); border:1px solid var(--border);
    border-radius:20px; width:100%; max-width:920px; max-height:92vh;
    display:flex; flex-direction:column; overflow:hidden;
    box-shadow:0 24px 80px rgba(0,0,0,0.4);
    animation:modalIn 0.25s cubic-bezier(0.22,1,0.36,1);
}
@keyframes modalIn { from { transform:translateY(20px) scale(0.98); opacity:0; } to { transform:none; opacity:1; } }
.sb-modal-header {
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 22px; border-bottom:1px solid var(--border);
    background:var(--input-bg); flex-shrink:0;
}
.sb-modal-header-left { display:flex; align-items:center; gap:14px; }
.sb-modal-avatar { flex-shrink:0; }
.sb-modal-header h3 { font-family:'Sora',sans-serif; font-size:16px; font-weight:700; color:var(--text); margin:0 0 3px; }
.sb-modal-meta { font-size:12px; color:var(--text-3); margin:0; }
.sb-modal-close {
    width:34px; height:34px; border-radius:9px; background:var(--input-bg-f);
    border:1px solid var(--border); color:var(--text-3); font-size:15px;
    cursor:pointer; display:flex; align-items:center; justify-content:center; transition:all 0.2s;
}
.sb-modal-close:hover { background:rgba(239,68,68,0.1); color:#fca5a5; border-color:rgba(239,68,68,0.3); }
.sb-modal-body { flex:1; overflow-y:auto; padding:22px; }
.sb-modal-body::-webkit-scrollbar { width:6px; }
.sb-modal-body::-webkit-scrollbar-thumb { background:var(--border-h); border-radius:3px; }

/* Detail sections inside modal */
.sb-detail-section { margin-bottom:24px; }
.sb-detail-title {
    font-size:13px; font-weight:700; color:var(--primary-l);
    margin-bottom:12px; display:flex; align-items:center; gap:7px;
    text-transform:uppercase; letter-spacing:0.4px;
}
[data-theme="light"] .sb-detail-title { color:var(--primary); }
.sb-info-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:10px; }
.sb-info-item {
    background:var(--input-bg); border:1px solid var(--border);
    border-radius:10px; padding:10px 14px;
}
.sb-info-label { font-size:11px; color:var(--text-3); font-weight:600; text-transform:uppercase; letter-spacing:0.4px; margin-bottom:4px; }
.sb-info-value { font-size:13px; font-weight:600; color:var(--text); }

/* Materials */
.sb-materials-list { display:flex; flex-direction:column; gap:6px; }
.sb-material-item {
    display:flex; align-items:center; gap:10px; padding:8px 12px;
    border-radius:9px; background:var(--input-bg); border:1px solid var(--border);
    font-size:13px; color:var(--text-2); transition:border-color 0.2s;
}
.sb-material-item.sb-checked { border-color:rgba(52,211,153,0.3); }
[data-theme="light"] .sb-material-item.sb-checked { border-color:#a7f3d0; }
[data-theme="dark"] .sb-material-item { background:var(--input-bg); color:var(--text-2); }
[data-theme="dark"] .sb-material-item.sb-checked { background:rgba(16,185,129,0.1); color:var(--text-2); }

/* Table */
.sb-table-wrap { overflow-x:auto; margin-bottom:10px; border-radius:10px; box-shadow:0 0 0 1px var(--border); }
.sb-table { width:100%; border-collapse:collapse; min-width:280px; font-size:13px; }
.sb-table th {
    background:#0A66C2;
    color:white; padding:10px 14px; text-align:left; font-weight:600; font-size:12px;
}
.sb-table td { padding:9px 14px; border-bottom:1px solid var(--border); color:var(--text-2); }
.sb-table tr:last-child td { border-bottom:none; }
.sb-table tr:nth-child(even) td { background:var(--input-bg); }
.sb-notes-box {
    background:var(--input-bg); border:1px solid var(--border);
    border-radius:9px; padding:10px 14px; font-size:12px; color:var(--text-2); margin-top:8px;
}

/* Q&A */
.sb-answer-item { margin-bottom:14px; background:var(--input-bg); border:1px solid var(--border); border-radius:10px; padding:12px 14px; }
.sb-answer-q {
    font-size:13px; font-weight:600; color:var(--text);
    margin-bottom:7px; line-height:1.6;
}
.sb-answer-text {
    background:var(--input-bg); border:1px solid var(--border);
    border-radius:10px; padding:12px 14px; font-size:13px; color:var(--text-2); line-height:1.7;
}
.sb-answer-empty { font-size:12px; color:var(--text-3); font-style:italic; padding:4px 0; }

/* File link */
.sb-file-link {
    display:inline-flex; align-items:center; gap:8px;
    background:#0A66C2;
    color:white; padding:10px 20px; border-radius:10px;
    font-size:13px; font-weight:600; text-decoration:none; transition:opacity 0.2s;
}
.sb-file-link:hover { opacity:0.88; }

/* Analysis section */
.sb-analyze-form {
    background:var(--input-bg); border:1.5px solid var(--border-h);
    border-radius:14px; padding:18px 20px; margin-top:8px; margin-bottom:8px;
}
.sb-analyze-title {
    font-size:14px; font-weight:700; color:#60a5fa;
    display:flex; align-items:center; gap:7px; margin-bottom:4px;
    font-family:'Sora',sans-serif;
}
.sb-analyze-meta { font-size:11px; color:var(--text-3); margin-bottom:14px; }
.sb-analyze-btn {
    display:inline-flex; align-items:center; gap:7px;
    padding:9px 18px; border:none; border-radius:10px;
    background:linear-gradient(135deg,#2563eb,#1d4ed8);
    color:white; font-size:13px; font-weight:600;
    cursor:pointer; font-family:'Inter',sans-serif;
    transition:opacity 0.2s;
}
.sb-analyze-btn:hover { opacity:0.88; }
.sb-analyze-btn:disabled { opacity:0.5; cursor:not-allowed; }
.sb-analyze-results { margin-top:14px; display:flex; flex-direction:column; gap:8px; }
.sb-analyze-row {
    background:var(--surface); border:1.5px solid var(--border);
    border-radius:10px; padding:10px 14px;
}
.sb-analyze-q { font-size:12px; font-weight:700; color:var(--text-2); margin-bottom:6px; }
.sb-analyze-badges { display:flex; gap:8px; flex-wrap:wrap; }
.sb-badge {
    display:inline-flex; align-items:center; gap:5px;
    padding:4px 10px; border-radius:20px; font-size:11px; font-weight:700;
    white-space:nowrap;
}
.sb-badge-green  { background:rgba(52,211,153,0.12); color:#34d399; border:1px solid rgba(52,211,153,0.25); }
.sb-badge-yellow { background:rgba(251,191,36,0.12);  color:#fbbf24; border:1px solid rgba(251,191,36,0.25); }
.sb-badge-red    { background:rgba(239,68,68,0.12);   color:#f87171; border:1px solid rgba(239,68,68,0.25); }
.sb-badge-gray   { background:var(--input-bg);         color:var(--text-3); border:1px solid var(--border); }
[data-theme="light"] .sb-badge-green  { background:#d1fae5; color:#059669; border-color:#a7f3d0; }
[data-theme="light"] .sb-badge-yellow { background:#fef9c3; color:#b45309; border-color:#fde68a; }
[data-theme="light"] .sb-badge-red    { background:#fee2e2; color:#dc2626; border-color:#fca5a5; }

/* Rubric table (shared with activity.html) */
.av-rubric-wrap { overflow-x:auto; margin:4px 0 8px; }
.av-rubric-table { width:100%; border-collapse:collapse; font-size:13px; font-family:'DM Sans',sans-serif; }
.av-rubric-th { background:var(--surface-2,#f1f5f9); padding:8px 10px; border:1.5px solid var(--border); font-weight:700; text-align:center; color:var(--text-1); }
.av-rubric-th .av-rubric-pts-label { font-size:10px; font-weight:500; color:var(--primary); }
.av-rubric-td { padding:8px 10px; border:1.5px solid var(--border); vertical-align:top; color:var(--text-1); }
.av-rubric-criteria-col { width:140px; min-width:110px; }
.av-rubric-criteria-name { font-weight:600; color:var(--text-1); }
.av-rubric-desc { color:var(--text-2); font-size:12px; text-align:left; }
.av-rubric-total-label { font-weight:700; background:var(--surface-2,#f1f5f9); color:var(--text-1); }
.av-rubric-total-pts { text-align:center; font-weight:700; background:var(--surface-2,#f1f5f9); color:var(--primary); }

/* Rubric grading (inside modal) */
.sb-rubric-wrap { margin: 2px 0; }
.sb-rubric-hint { font-size:11px; color:var(--text-3); margin-bottom:8px; font-style:italic; }
.sb-rubric-cell { cursor:pointer; transition:background 0.15s, border-color 0.15s; }
.sb-rubric-cell:hover { background:rgba(99,102,241,0.08); }
.sb-rubric-selected { background:rgba(99,102,241,0.18) !important; border-color:var(--primary) !important; color:var(--text-1) !important; font-weight:600; }
[data-theme="light"] .sb-rubric-selected { background:rgba(99,102,241,0.12) !important; }
.sb-rubric-score-row { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-top:10px; }
.sb-rubric-score-label { font-size:13px; font-weight:600; color:var(--text-2); }
.sb-rubric-score-val { font-size:22px; font-weight:800; color:var(--primary-l); font-family:'Sora',sans-serif; }
[data-theme="light"] .sb-rubric-score-val { color:var(--primary); }
.sb-rubric-score-denom { font-size:14px; color:var(--text-3); }
.sb-rubric-pct { font-size:14px; font-weight:700; color:var(--text-2); margin-left:6px; }
.sb-rubric-apply-btn {
    display:inline-flex; align-items:center; gap:6px;
    padding:7px 14px; border:none; border-radius:9px;
    background:linear-gradient(135deg,#6366f1,#4f46e5);
    color:white; font-size:12px; font-weight:600; cursor:pointer;
    font-family:'Inter',sans-serif; transition:opacity 0.2s; margin-left:4px;
}
.sb-rubric-apply-btn:hover { opacity:0.88; }
.sb-rubric-save-btn {
    display:inline-flex; align-items:center; gap:7px;
    margin-top:10px; padding:9px 18px; border:none; border-radius:10px;
    background:linear-gradient(135deg,#10b981,#059669);
    color:white; font-size:13px; font-weight:600; cursor:pointer;
    font-family:'Inter',sans-serif; transition:opacity 0.2s;
}
.sb-rubric-save-btn:hover { opacity:0.88; }
.sb-rubric-save-btn:disabled { opacity:0.5; cursor:not-allowed; }

/* ===== PEER ASSESSMENT RESULTS ===== */
.sb-pa-wrap { margin: 2px 0; display:flex; flex-direction:column; gap:0; }
.sb-pa-anon-note { font-size:11px; color:var(--text-3); margin:0 0 10px; font-style:italic; display:flex; align-items:center; gap:5px; }
.sb-pa-table { width:100%; border-collapse:collapse; font-size:13px; font-family:'DM Sans',sans-serif; }
.sb-pa-th { background:var(--surface-2,#f1f5f9); padding:7px 10px; border:1.5px solid var(--border); font-weight:700; color:var(--text-1); text-align:left; }
.sb-pa-td { padding:7px 10px; border:1.5px solid var(--border); vertical-align:middle; color:var(--text-1); }
.sb-pa-criterion { min-width:120px; font-weight:600; }
.sb-pa-bar-cell { width:100%; }
.sb-pa-score { white-space:nowrap; font-weight:700; text-align:right; min-width:80px; }
.sb-pa-raters { font-size:11px; font-weight:400; color:var(--text-3); margin-left:4px; }
.sb-pa-bar-wrap { background:var(--border); border-radius:4px; height:8px; overflow:hidden; min-width:60px; }
.sb-pa-bar-fill { height:100%; border-radius:4px; transition:width 0.4s; }
/* subsections */
.sb-pa-subsection { display:flex; flex-direction:column; gap:4px; }
.sb-pa-sub-label { font-size:12px; font-weight:700; color:var(--text-2); display:flex; align-items:center; gap:6px; margin-bottom:4px; flex-wrap:wrap; }
.sb-pa-anon-badge { font-size:10px; font-weight:500; color:var(--text-3); background:var(--border); border-radius:20px; padding:2px 8px; display:inline-flex; align-items:center; gap:4px; }
/* peer assessment — member list */
.sb-pa-members-list { display:flex; flex-direction:column; gap:6px; }
.sb-pa-member-item { border:1.5px solid var(--border); border-radius:12px; overflow:hidden; }
.sb-pa-member-header { display:flex; align-items:center; gap:10px; padding:10px 14px; cursor:pointer; background:var(--surface-2,#f8fafc); transition:background 0.15s; user-select:none; }
.sb-pa-member-header:hover { background:var(--primary-10,rgba(10,102,194,0.06)); }
.sb-pa-member-name { flex:1; font-size:14px; font-weight:700; color:var(--text-1); display:flex; align-items:center; gap:6px; }
.sb-pa-member-body { display:none; padding:12px 14px; background:var(--surface,#fff); border-top:1px solid var(--border); flex-direction:column; gap:12px; }
/* accordion (given sub-list) */
.sb-pa-accordion { display:flex; flex-direction:column; gap:4px; }
.sb-pa-acc-item { border:1.5px solid var(--border); border-radius:10px; overflow:hidden; }
.sb-pa-acc-header { display:flex; align-items:center; gap:10px; padding:9px 12px; cursor:pointer; background:var(--surface-2,#f8fafc); transition:background 0.15s; user-select:none; }
.sb-pa-acc-header:hover { background:var(--primary-10,rgba(10,102,194,0.06)); }
.sb-pa-acc-no-rating { cursor:default !important; }
.sb-pa-acc-no-rating:hover { background:var(--surface-2,#f8fafc) !important; }
.sb-pa-acc-name { flex:1; font-size:13px; font-weight:600; color:var(--text-1); display:flex; align-items:center; gap:5px; }
.sb-pa-acc-avg { font-size:14px; font-weight:800; font-family:'Sora',sans-serif; flex-shrink:0; }
.sb-pa-acc-no-label { font-size:11px; color:var(--text-3); }
.sb-pa-acc-caret { color:var(--text-3); font-size:13px; flex-shrink:0; transition:transform 0.2s; }
.sb-pa-acc-body { display:none; padding:10px 12px; background:var(--surface,#fff); border-top:1px solid var(--border); }
/* modal */
.sb-pa-modal-overlay {
    position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:9999;
    display:flex; align-items:center; justify-content:center; padding:16px;
}
.sb-pa-modal {
    background:var(--surface,#fff); border-radius:18px; padding:24px;
    max-width:480px; width:100%; box-shadow:0 20px 60px rgba(0,0,0,0.25);
    display:flex; flex-direction:column; gap:16px;
}
.sb-pa-modal-header { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; }
.sb-pa-modal-title { font-size:16px; font-weight:800; color:var(--text-1); display:flex; align-items:center; gap:8px; font-family:'Sora',sans-serif; }
.sb-pa-modal-sub { font-size:13px; color:var(--text-2); margin-top:4px; }
.sb-pa-modal-close {
    background:none; border:none; cursor:pointer; color:var(--text-3);
    padding:4px; border-radius:8px; display:flex; align-items:center;
    font-size:18px; transition:color 0.15s; flex-shrink:0;
}
.sb-pa-modal-close:hover { color:var(--text-1); }

/* Grade form (inside modal) */
.sb-grade-form {
    background:var(--input-bg); border:1.5px solid var(--border-h);
    border-radius:14px; padding:18px 20px;
}
.sb-grade-form-title {
    font-size:14px; font-weight:700; color:var(--primary-l);
    display:flex; align-items:center; gap:7px; margin-bottom:16px;
    font-family:'Sora',sans-serif;
}
[data-theme="light"] .sb-grade-form-title { color:var(--primary); }
.sb-grade-row { display:flex; align-items:center; gap:12px; margin-bottom:14px; flex-wrap:wrap; }
.sb-grade-row-label { font-size:13px; font-weight:600; color:var(--text-2); white-space:nowrap; }
.sb-grade-input {
    width:70px; padding:8px 12px;
    background:var(--surface); border:1.5px solid var(--border);
    border-radius:9px; font-size:16px; font-weight:700; color:var(--text);
    text-align:center; outline:none; transition:border-color 0.2s; font-family:'Sora',sans-serif;
}
.sb-grade-input:focus { border-color:var(--primary); }
.sb-grade-denom-label { font-size:13px; color:var(--text-3); font-weight:600; }
.sb-grade-slider { flex:1; min-width:120px; accent-color:var(--primary); cursor:pointer; height:4px; }
.sb-quick-wrap { display:flex; align-items:center; gap:10px; margin-bottom:14px; flex-wrap:wrap; }
.sb-quick-label { font-size:12px; color:var(--text-3); font-weight:600; white-space:nowrap; }
.sb-quick-grades { display:flex; gap:6px; flex-wrap:wrap; }
.sb-quick-btn {
    padding:4px 10px; border-radius:7px; font-size:12px; font-weight:700; cursor:pointer;
    background:var(--input-bg-f); border:1px solid var(--border); color:var(--text-2);
    font-family:'DM Sans',sans-serif; transition:all 0.15s;
}
.sb-quick-btn:hover { background:var(--primary); color:white; border-color:var(--primary); }
.sb-feedback-label { font-size:12px; color:var(--text-3); font-weight:600; display:block; margin-bottom:7px; }
.sb-feedback-input {
    width:100%; padding:11px 14px; border-radius:10px;
    background:var(--surface); border:1.5px solid var(--border);
    color:var(--text); font-size:13px; font-family:'DM Sans',sans-serif;
    resize:vertical; outline:none; transition:border-color 0.2s; box-sizing:border-box;
    min-height:80px;
}
.sb-feedback-input::placeholder { color:var(--placeholder); }
.sb-feedback-input:focus { border-color:var(--primary); }
.sb-grade-actions { display:flex; align-items:center; gap:12px; margin-top:14px; flex-wrap:wrap; }
.sb-btn-save-grade {
    display:inline-flex; align-items:center; gap:7px;
    background:#0A66C2; color:white;
    border:none; padding:10px 22px; border-radius:10px;
    font-size:13px; font-weight:700; cursor:pointer; font-family:'DM Sans',sans-serif;
    transition:opacity 0.2s, transform 0.2s; box-shadow:0 4px 16px rgba(10,102,194,0.35);
}
.sb-btn-save-grade:hover { opacity:0.9; }
.sb-btn-save-grade:disabled { opacity:0.35; cursor:not-allowed; transform:none; }
.sb-grade-saved-msg {
    display:none; align-items:center; gap:6px;
    color:#34d399; font-size:13px; font-weight:700;
    animation:savedPop 0.3s ease;
}
@keyframes savedPop { from { transform:scale(0.85); opacity:0; } to { transform:none; opacity:1; } }
@keyframes pulse { 0%,100% { box-shadow:0 0 0 0 rgba(10,102,194,0.5); } 50% { box-shadow:0 0 0 8px rgba(10,102,194,0); } }

/* Empty state */
.db-empty-state { text-align:center; padding:48px 24px; }
.db-empty-icon { font-size:44px; margin-bottom:12px; opacity:0.3; color:var(--text-3); }
.db-empty-title { font-family:'Sora',sans-serif; font-size:15px; font-weight:700; color:var(--text-2); margin-bottom:4px; }
.db-empty-sub { font-size:13px; color:var(--text-3); }

/* ===== FULL ACTIVITY VIEW (submission modal) ===== */
.av-lab-header { background:#0A66C2; border-radius:14px; padding:20px 24px 22px; position:relative; overflow:hidden; text-align:center; }
.av-lab-header::before { content:''; position:absolute; width:180px; height:180px; border-radius:50%; background:rgba(255,255,255,0.07); top:-80px; right:60px; }
.av-lab-badge { display:inline-flex; align-items:center; gap:6px; background:rgba(255,255,255,0.15); color:white; border-radius:20px; padding:4px 12px; font-size:11px; font-weight:700; font-family:'DM Sans',sans-serif; letter-spacing:0.5px; margin-bottom:8px; }
.av-lab-title-text { font-family:'Unbounded',sans-serif; font-size:16px; font-weight:800; color:white; margin:0; line-height:1.4; }
.av-section-wrapper { background:var(--surface); border:1px solid var(--border); border-radius:14px; margin-bottom:8px; overflow:hidden; transition:border-color 0.2s; }
.av-section-wrapper:hover { border-color:var(--border-h); }
.av-section-header { display:flex; align-items:center; justify-content:space-between; padding:12px 16px; cursor:pointer; gap:10px; }
.av-section-header:hover { background:var(--input-bg); }
.av-section-header-left { display:flex; align-items:center; gap:10px; }
.av-section-header-right { display:flex; align-items:center; }
.av-section-icon { width:34px; height:34px; border-radius:9px; display:flex; align-items:center; justify-content:center; font-size:15px; flex-shrink:0; }
.av-section-label { font-size:14px; font-weight:700; color:var(--text); font-family:'DM Sans',sans-serif; }
.av-toggle-icon { color:var(--text-3); font-size:14px; transition:transform 0.25s; }
.av-toggle-icon.open { transform:rotate(0deg); }
.av-toggle-icon:not(.open) { transform:rotate(-90deg); }
.av-section-body { }
.av-section-body.hidden { display:none; }
.av-section-body-inner { padding:16px 18px 20px; }
.av-icon-blue   { background:rgba(59,130,246,0.12);  color:#60a5fa; }
.av-icon-purple { background:rgba(139,92,246,0.12);  color:#a78bfa; }
.av-icon-green  { background:rgba(16,185,129,0.12);  color:#34d399; }
.av-icon-orange { background:rgba(245,158,11,0.12);  color:#fbbf24; }
.av-icon-indigo { background:rgba(10,102,194,0.15);  color:var(--primary-l); }
.av-icon-teal   { background:rgba(20,184,166,0.12);  color:#2dd4bf; }
.av-icon-violet { background:rgba(139,92,246,0.12);  color:#a78bfa; }
.av-icon-slate  { background:var(--input-bg);        color:var(--text-3); }
.av-icon-yellow { background:rgba(234,179,8,0.15);   color:#facc15; }
.av-icon-grad   { background:#0A66C2; color:white; }
[data-theme="light"] .av-icon-purple { background:#EBF3FB; color:#8b5cf6; }
.av-view-content,.av-text-block,.intro-preview-wrap { font-family:'Merriweather',serif; font-size:14px; line-height:1.85; color:var(--text-2); }
.av-text-block { text-align:justify; }
.av-text-block p,.intro-preview-wrap p { margin:0 0 10px; }
.intro-preview-wrap h3 { margin:14px 0 6px; font-size:14px; font-weight:700; color:var(--text); }
#submissionModal .katex-display { display:flex !important; justify-content:center !important; margin:14px 0 !important; overflow-x:auto; }
.av-numbered-list { list-style:none; padding:0; margin:0; display:flex; flex-direction:column; gap:8px; }
.av-numbered-list li { display:flex; align-items:flex-start; gap:12px; font-size:14px; color:var(--text-2); font-family:'Merriweather',serif; line-height:1.6; }
.av-materials-list { display:flex; flex-direction:column; gap:6px; }

<script>
const token = localStorage.getItem('token');
if (!token) window.location.href = '/login';
initSessionGuard();
const role = localStorage.getItem('role');
const activityId = new URLSearchParams(window.location.search).get('id');

// ── Grade count-up ──
function runCountUp(container) {
    (container || document).querySelectorAll('[data-grade] .sb-grade-num').forEach(el => {
        const target = parseFloat(el.closest('[data-grade]').dataset.grade);
        if (isNaN(target)) return;
        el.textContent = '0';
        const start = performance.now();
        const dur = 700;
        function tick(now) {
            const p = Math.min((now - start) / dur, 1);
            const ease = 1 - Math.pow(1 - p, 3);
            el.textContent = Math.round(target * ease);
            if (p < 1) requestAnimationFrame(tick);
            else el.textContent = target;
        }
        requestAnimationFrame(tick);
    });
}

// Safe JSON — returns null if server sends HTML error instead of JSON
async function safeJson(res) {
    const ct = res.headers.get('content-type') || '';
    if (!ct.includes('application/json')) return null;
    try { return await res.json(); } catch { return null; }
}

if (!token || role !== 'professor') window.location.href = '/login';

// userName removed from navbar
document.body.classList.add('dashboard-body');

// ── Theme ──
function applyTheme(t) {
    document.documentElement.setAttribute('data-theme', t);
    localStorage.setItem('physlab_theme', t);
}
applyTheme(localStorage.getItem('physlab_theme') || 'dark');

// ── Particles ──
(function() {
    const pw = document.getElementById('particles');
    if (!pw) return;
    for (let i = 0; i < 200; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        p.style.cssText = `left:${Math.random()*100}%;animation-delay:-${Math.random()*8}s;animation-duration:${6+Math.random()*8}s;--drift:${(Math.random()-.5)*200}px`;
        pw.appendChild(p);
    }
})();

let allSubmissions  = [];
let allGroups       = [];

// ── Peer Assessment modal ────────────────────────────────────
function sbPaShowModal(el) {
    let data;
    try { data = JSON.parse(el.dataset.pa); } catch { return; }
    const { rater, ratee, scores } = data;
    const rows = scores.map(s => {
        const val = s.val !== null && s.val !== undefined ? Number(s.val) : null;
        const col = val !== null ? (val >= 75 ? '#22c55e' : val >= 50 ? '#f59e0b' : '#ef4444') : 'var(--text-3)';
        return `<tr>
            <td class="sb-pa-td sb-pa-criterion">${s.label}</td>
            <td class="sb-pa-td sb-pa-bar-cell">
                ${val !== null ? `<div class="sb-pa-bar-wrap"><div class="sb-pa-bar-fill" style="width:${Math.max(2,val)}%;background:${col};"></div></div>` : '<span style="color:var(--text-3);font-size:12px;">—</span>'}
            </td>
            <td class="sb-pa-td sb-pa-score" style="color:${col};">${val !== null ? val + '%' : '—'}</td>
        </tr>`;
    }).join('');
    const nums = scores.map(s => s.val).filter(v => v !== null && !isNaN(Number(v))).map(Number);
    const avg  = nums.length ? Math.round(nums.reduce((a,b)=>a+b,0)/nums.length) : null;
    const avgCol = avg !== null ? (avg >= 75 ? '#22c55e' : avg >= 50 ? '#f59e0b' : '#ef4444') : 'var(--text-3)';

    const overlay = document.createElement('div');
    overlay.className = 'sb-pa-modal-overlay';
    overlay.innerHTML = `<div class="sb-pa-modal" onclick="event.stopPropagation()">
        <div class="sb-pa-modal-header">
            <div>
                <div class="sb-pa-modal-title"><i class="ph-bold ph-users-three"></i> Peer Assessment</div>
                <div class="sb-pa-modal-sub">How <strong>${rater}</strong> rated <strong>${ratee}</strong></div>
            </div>
            <button class="sb-pa-modal-close" onclick="this.closest('.sb-pa-modal-overlay').remove()"><i class="ph-bold ph-x"></i></button>
        </div>
        <table class="sb-pa-table">
            <thead><tr>
                <th class="sb-pa-th sb-pa-criterion">Criterion</th>
                <th class="sb-pa-th sb-pa-bar-cell">Rating</th>
                <th class="sb-pa-th sb-pa-score">Score</th>
            </tr></thead>
            <tbody>${rows}</tbody>
            ${avg !== null ? `<tfoot><tr>
                <td class="sb-pa-td sb-pa-criterion" style="font-weight:700;">Overall Average</td>
                <td class="sb-pa-td sb-pa-bar-cell">
                    <div class="sb-pa-bar-wrap"><div class="sb-pa-bar-fill" style="width:${avg}%;background:${avgCol};"></div></div>
                </td>
                <td class="sb-pa-td sb-pa-score" style="color:${avgCol};font-weight:700;">${avg}%</td>
            </tr></tfoot>` : ''}
        </table>
    </div>`;
    overlay.addEventListener('click', () => overlay.remove());
    document.body.appendChild(overlay);
}
function sbPaToggle(header) {
    const item  = header.closest('.sb-pa-acc-item');
    const body  = item.querySelector('.sb-pa-acc-body');
    const caret = header.querySelector('.sb-pa-acc-caret');
    const isOpen = body.style.display === 'block';
    body.style.display  = isOpen ? 'none' : 'block';
    if (caret) caret.style.transform = isOpen ? '' : 'rotate(180deg)';
}
function sbPaMemberToggle(header) {
    const item  = header.closest('.sb-pa-member-item');
    const body  = item.querySelector('.sb-pa-member-body');
    const caret = header.querySelector('.sb-pa-acc-caret');
    const isOpen = body.style.display === 'flex';
    body.style.display  = isOpen ? 'none' : 'flex';
    if (caret) caret.style.transform = isOpen ? '' : 'rotate(180deg)';
}
// ────────────────────────────────────────────────────────────
let allGroupDrafts  = {};   // groupId → latest submission/draft (for progress)
let parsedActivity  = null;
let currentSubmission = null;
let currentView = 'groups';
let _groupAttendance = {}; // groupId → { studentId → 'present'|'absent' }

// ============================================================
// LOAD DATA
// ============================================================
function skeletonRows(n) {
    return Array.from({length:n}, () => `
    <div class="skeleton-row" style="margin-bottom:10px;">
      <div class="skeleton-box sk-avatar"></div>
      <div class="sk-lines">
        <div class="skeleton-box sk-line1"></div>
        <div class="skeleton-box sk-line2"></div>
      </div>
    </div>`).join('');
}
async function loadData() {
    document.getElementById('submissionsList').innerHTML = skeletonRows(5);
    document.getElementById('groupSubmissionsList').innerHTML = skeletonRows(3);
    try {
        const classId = new URLSearchParams(window.location.search).get('class_id');

        const fetches = [
            fetch(`/api/submissions/${activityId}/all`, {
                headers: { 'Authorization': `Bearer ${token}` }
            }),
            fetch(`/api/activities/${activityId}/parsed`, {
                headers: { 'Authorization': `Bearer ${token}` }
            })
        ];

        // Load groups if class_id provided
        if (classId) {
            fetches.push(fetch(`/api/classes/${classId}/groups`, {
                headers: { 'Authorization': `Bearer ${token}` }
            }));
        }

        const [subRes, parsedRes, grpRes] = await Promise.all(fetches);

        if (subRes.ok)    allSubmissions = await safeJson(subRes)    || [];
        if (parsedRes.ok) parsedActivity = await safeJson(parsedRes) || null;
        if (grpRes?.ok)   allGroups      = await safeJson(grpRes)    || [];

        // Fetch latest draft/submission per group for progress indicators
        if (classId && allGroups.length > 0) {
            try {
                const draftRes = await fetch(
                    `/api/submissions/${activityId}/all-group-drafts?class_id=${classId}`,
                    { headers: { 'Authorization': `Bearer ${token}` } }
                );
                if (draftRes.ok) allGroupDrafts = await safeJson(draftRes) || {};
            } catch { /* non-critical */ }
        }

        updateStats();
        renderGroupSubmissions();
        renderSubmissions();

        if (parsedActivity) {
            const titleSection = parsedActivity.sections?.find(s => s.type === 'lab_title');
            if (titleSection) {
                document.getElementById('activityTitleDisplay').textContent =
                    titleSection.title + (titleSection.content?.[0]?.text ? ' — ' + titleSection.content[0].text : '');
            }
        }
    } catch (err) {
        document.getElementById('groupSubmissionsList').innerHTML =
            '<p style="color:red;text-align:center;padding:40px;">Cannot load submissions.</p>';
    }
}

// ============================================================
// STATS
// ============================================================
function updateStats() {
    const totalGroups = allGroups.length;
    const submittedGroups = allGroups.filter(g => {
        const memberSubs = (g.members || []).map(m => allSubmissions.find(s => s.student_id === m.id));
        return memberSubs.some(s => s?.status === 'submitted' || s?.status === 'graded');
    }).length;
    const pending = totalGroups - submittedGroups;
    const graded  = allSubmissions.filter(s => s.status === 'graded').length;
    const grades  = allSubmissions.filter(s => s.grade != null).map(s => s.grade);
    const avg     = grades.length > 0
        ? (grades.reduce((a, b) => a + b, 0) / grades.length).toFixed(1) : '—';

    document.getElementById('statTotal').textContent  = totalGroups > 0 ? `${submittedGroups}/${totalGroups}` : '0';
    document.getElementById('statGroups').textContent = pending;
    document.getElementById('statGraded').textContent = graded;
    document.getElementById('statAvg').textContent    = avg;

    // Progress bar
    const wrap = document.getElementById('sbProgressWrap');
    const fill = document.getElementById('sbProgressFill');
    const pct  = totalGroups > 0 ? Math.round((submittedGroups / totalGroups) * 100) : 0;
    if (wrap && totalGroups > 0) {
        wrap.style.display = 'block';
        document.getElementById('sbProgressLabel').textContent = `${submittedGroups} / ${totalGroups} groups`;
        document.getElementById('sbProgressPct').textContent   = pct + '%';
        setTimeout(() => { if (fill) fill.style.width = pct + '%'; }, 100);
    }
}

function calcGroupProgress(groupId) {
    const sub = allGroupDrafts[String(groupId)];
    if (!sub) return null;

    const questions = parsedActivity?.sections?.find(s => s.type === 'guide_questions');
    const qItems = (questions?.content || []).filter(q => q.question || q.text);
    const total = qItems.length;
    if (total === 0) return null;

    const answers = sub.answers || {};
    const answered = qItems.filter((_, i) => {
        const v = answers[String(i)] ?? answers[i];
        return v && String(v).trim().length > 0;
    }).length;

    return { answered, total, pct: Math.round((answered / total) * 100), status: sub.status };
}

function buildProgressPill(groupId) {
    const p = calcGroupProgress(groupId);
    if (!p) return '';
    const cls = p.answered === p.total ? 'complete' : '';
    return `<span class="sb-progress-pill">
        <i class="ph-bold ph-check-square"></i> ${p.answered}/${p.total}
        <span class="sb-progress-track"><span class="sb-progress-fill ${cls}" style="width:${p.pct}%"></span></span>
    </span>`;
}

function toggleGroupCard(groupId) {
    const card = document.getElementById(`sb-group-card-${groupId}`);
    const body = document.getElementById(`sb-group-body-${groupId}`);
    if (!card || !body) return;
    const opening = !body.classList.contains('open');
    body.classList.toggle('open', opening);
    card.classList.toggle('open', opening);
}

function syncGroupSlider(groupId, val) {
    const slider = document.getElementById(`gradeSlider-${groupId}`);
    const btn    = document.getElementById(`saveGroupGradeBtn-${groupId}`);
    if (slider && val !== '') slider.value = val;
    if (btn) btn.disabled = (val === '');
}

function syncGroupInput(groupId, val) {
    const input = document.getElementById(`gradeInput-${groupId}`);
    const btn   = document.getElementById(`saveGroupGradeBtn-${groupId}`);
    if (input) input.value = val;
    if (btn)   btn.disabled = false;
}


function setGroupGradeQuick(groupId, val) {
    const input  = document.getElementById(`gradeInput-${groupId}`);
    const slider = document.getElementById(`gradeSlider-${groupId}`);
    const btn    = document.getElementById(`saveGroupGradeBtn-${groupId}`);
    if (input)  input.value  = val;
    if (slider) slider.value = val;
    if (btn)    btn.disabled = false;
}

async function submitGroupGrade(groupId) {
    const grade    = parseFloat(document.getElementById(`gradeInput-${groupId}`).value);
    const feedback = document.getElementById(`feedbackInput-${groupId}`).value;
    const classId  = new URLSearchParams(window.location.search).get('class_id');

    if (isNaN(grade) || grade < 0 || grade > 100) {
        showToast('Please enter a valid grade (0–100)!', 'warning'); return;
    }
    if (!classId) {
        showToast('Missing class_id in URL!', 'error'); return;
    }

    try {
        const res = await fetch(
            `/api/classes/${classId}/groups/${groupId}/grade`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
            body: JSON.stringify({ activity_id: parseInt(activityId), grade, feedback })
        });
        const data = await res.json();
        if (res.ok) {
            // Update local submissions
            const group = allGroups.find(g => g.id === groupId);
            if (group) {
                group.members.forEach(m => {
                    const sub = allSubmissions.find(s => s.student_id === m.id);
                    if (sub) { sub.grade = grade; sub.feedback = feedback; sub.status = 'graded'; }
                });
            }
            updateStats();
            renderGroupSubmissions();
            renderSubmissions();
            const msg = document.getElementById(`gradeSavedMsg-${groupId}`);
            if (msg) { msg.style.display = 'inline-flex'; setTimeout(() => msg.style.display = 'none', 2500); }
            showToast(`${data.message}`, 'success');
        } else {
            showToast(data.message || 'Cannot save grade!', 'error');
        }
    } catch { showToast('Cannot connect to server!', 'error'); }
}

function nameToGradient(name) {
    let hash = 0;
    for (let i = 0; i < (name||'').length; i++) hash = (hash * 31 + name.charCodeAt(i)) & 0xffffffff;
    return gradients[Math.abs(hash) % gradients.length];
}
function makeInitialsAvatar(name, size, radius, fontSize) {
    const parts = (name||'?').trim().split(/\s+/);
    const initials = parts.length >= 2
        ? (parts[0][0] + parts[parts.length-1][0]).toUpperCase()
        : (name||'?').charAt(0).toUpperCase();
    const grad = nameToGradient(name);
    return `<div style="width:${size}px;height:${size}px;border-radius:${radius};background:${grad};
        display:flex;align-items:center;justify-content:center;color:white;
        font-weight:800;font-size:${fontSize}px;letter-spacing:0.5px;flex-shrink:0;
        box-shadow:0 2px 8px rgba(10,102,194,0.25);">${initials}</div>`;
}
function makePhotoAvatar(src, size, radius) {
    return `<div style="width:${size}px;height:${size}px;border-radius:${radius};overflow:hidden;flex-shrink:0;

}
